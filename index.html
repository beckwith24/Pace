<title>Pace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0B0E13;--card:#171B22;--card2:#11151B;--raise:#1E232C;--line:#2A303A;--hair:#20262F;
  --text:#F2F4F7;--muted:#9AA4B2;--soft:#D5DAE1;
  --lime:#C6F432;--lime-ink:#0E1116;--amber:#FFB066;--red:#FF6B6F;--good:#4ADE80;
  --z1:#8FA3BF;--z2:#4EA8FF;--z3:#3FD08A;--z4:#FF9F43;--z5:#FF5A5F;
  --display:'Barlow Condensed',system-ui,sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.sheet-open{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
#view{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 108px);display:flex;flex-direction:column;gap:12px}

/* progress + status */
#progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:20;overflow:hidden;padding-top:env(safe-area-inset-top);box-sizing:content-box;pointer-events:none}
#progress::after{content:"";position:absolute;bottom:0;height:3px;width:40%;background:var(--lime);border-radius:2px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{left:-40%}100%{left:100%}}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(198,244,50,.25);border-top-color:var(--lime);display:inline-block;flex-shrink:0;animation:spin .8s linear infinite;vertical-align:-2px}
.btn.primary .spin{border-color:rgba(14,17,22,.25);border-top-color:var(--lime-ink)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin,#progress::after{animation:none}#progress::after{left:0;width:100%;opacity:.6}}
.sync-chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:600;color:var(--soft);white-space:nowrap;max-width:190px;flex-shrink:1;min-width:0}
.sync-chip span:last-child{overflow:hidden;text-overflow:ellipsis}
.sync-chip svg{flex-shrink:0;color:var(--good)}
.sync-chip.busy{color:var(--text);border-color:#3A4A1F}
.dot{width:8px;height:8px;border-radius:4px;background:var(--muted);display:inline-block;flex-shrink:0}
.dot.demo{background:var(--amber)}
body.busy .dimmable{opacity:.55;transition:opacity .2s}
.dimmable{transition:opacity .2s}

/* header */
.top{display:flex;align-items:center;gap:10px;min-height:52px}
.top .grow{flex:1;min-width:0}
h1{margin:0;font-family:var(--display);font-size:36px;font-weight:700;letter-spacing:.3px;line-height:1.02}
h1.h-sm{font-size:26px;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--muted);font-weight:500;margin-top:2px}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:disabled{opacity:.35}
.icon-btn.flip svg{transform:scaleX(-1)}
.lead{margin:0;color:var(--soft)}

/* cards */
.card{background:var(--card);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.card.flat{gap:12px}
.eyebrow{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.8px;margin-top:4px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px;color:var(--muted)} .center{text-align:center}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--lime-ink);padding:4px 8px;border-radius:8px;white-space:nowrap}
.pill svg{width:12px;height:12px}
.pill.amber{background:var(--amber)} .pill.red{background:var(--red)} .pill.blue{background:var(--z2)} .pill.good{background:var(--good)}
.link{background:none;border:0;padding:6px 0;color:var(--lime);font-weight:600;font-size:13px;text-align:left}
.banner{background:#1D2414;border:1px solid #3A4A1F;border-radius:14px;padding:10px 12px;font-size:13px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.banner .link{padding:0}
.banner.err{background:#2A1517;border-color:#5A2A2E;flex-wrap:nowrap;align-items:flex-start}
.banner.err svg{color:var(--red);flex-shrink:0;margin-top:1px}
.btn{min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:0 12px}
.btn.primary{background:var(--lime);border:0;color:var(--lime-ink);font-weight:700;font-size:16px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--red);border-color:#5A2A2E}
.btn.small-btn{min-height:42px;font-size:14px}
.btn:disabled{opacity:.7}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex-shrink:0;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:#B8C0CC;font-size:13px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.chips.static{margin:0;padding:0;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;color:var(--soft);background:var(--card);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--card);border-radius:12px;padding:4px}
.seg button{height:38px;border:0;border-radius:9px;background:transparent;color:#B8C0CC;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--lime);color:var(--lime-ink);font-weight:700}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);gap:2px}
.split.thin{height:6px}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--soft)}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i,.tr i{display:inline-block;flex-shrink:0}
i.ln{width:14px;height:2px;border-radius:1px}
i.sq{width:10px;height:10px;border-radius:2px}
i.bd{width:14px;height:10px;border-radius:2px;opacity:.35}

/* readiness */
.ready-top{display:flex;align-items:center;gap:16px}
.ring{width:84px;height:84px;border-radius:50%;padding:7px;flex-shrink:0}
.ring>div{width:100%;height:100%;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:28px;font-weight:700;line-height:1}
.ring span{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.6px;margin-top:2px}
.ready-head{font-weight:600;font-size:16px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;border-top:1px solid var(--hair);padding-top:10px}
.metric{display:flex;flex-direction:column;min-width:0}
.ml{font-size:11px;color:var(--muted);font-weight:500}
.mv{font-weight:600}
.ms{font-size:11px;color:var(--muted)} .ms.warn{color:var(--amber)}
.note-card{flex-direction:row;align-items:flex-start;font-size:13px;color:var(--soft)}
.note-card svg{flex-shrink:0;color:var(--muted)}

/* workout */
.sess{display:flex;gap:12px;align-items:center;background:none;border:0;padding:0;text-align:left;width:100%}
.sess>svg{color:var(--muted);flex-shrink:0}
.sess-icon,.li-icon{width:44px;height:44px;border-radius:12px;background:var(--raise);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--soft)}
.k-run,.k-treadmill{color:#7FB5F2} .k-ride,.k-zwift{color:#F08A5D} .k-strength{color:#4CC79A} .k-hike{color:#B3AAF2} .k-rest{color:var(--muted)}
.sess .grow{display:flex;flex-direction:column}
.sess-name{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.05}
.shape{display:flex;gap:2px;align-items:flex-end}
.shape>div{border-radius:3px;min-width:2px}
.why{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--soft)}
.why svg{color:var(--amber);flex-shrink:0;margin-top:1px}
.why.calm svg{color:var(--muted)}
.watch-line{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);justify-content:center}
.watch-line.ok{color:var(--soft)} .watch-line.ok svg{color:var(--good)}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:8px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 7px;background:var(--card);border:0;border-radius:12px;min-height:72px}
.day .dn{font-size:11px;color:var(--muted);font-weight:600}
.day .di svg{width:20px;height:20px}
.day .dot{width:6px;height:6px;border-radius:3px}
.day.on{background:var(--lime)} .day.on .dn,.day.on .di{color:var(--lime-ink)}
.thumbs{display:flex;gap:6px;overflow:hidden}
.thumbs img{width:56px;height:40px;object-fit:cover;border-radius:8px;background:var(--card2);flex-shrink:0}

/* plan */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weeknav b{font-size:15px}
.list{display:flex;flex-direction:column;gap:6px}
.li,.tpl,.srow{display:flex;align-items:center;gap:12px;background:var(--card);border:0;border-radius:14px;padding:10px 12px;min-height:60px;text-align:left;width:100%}
.li>svg,.srow>svg{color:var(--muted);flex-shrink:0}
.li.on{background:#1D2414;outline:1px solid var(--lime)}
.li-day{width:30px;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);flex-shrink:0;line-height:1.2}
.li-day b{font-size:11px;letter-spacing:.4px;text-transform:uppercase}
.li.on .li-day{color:var(--lime)}
.li .li-icon{width:36px;height:36px;border-radius:10px}
.li .li-icon svg{width:20px;height:20px}
.li-main{flex:1;display:flex;flex-direction:column;min-width:0}
.li-name{font-weight:600;font-size:15px}
.bullet{display:flex;gap:8px;font-size:13px;color:var(--soft)}
.bullet.warn>span:first-child{color:var(--amber)} .bullet.good>span:first-child{color:var(--lime)} .bullet.info>span:first-child{color:var(--muted)}

/* library */
.search{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;color:var(--text);width:100%;-webkit-appearance:none;appearance:none}
.tpl{align-items:flex-start;padding:12px}
.tpl .grow{display:flex;flex-direction:column;gap:4px}
.tpl-desc{font-size:13px;color:var(--soft)}
.tpl .shape{margin-top:4px}
.lvl{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;border:1px solid var(--line);color:var(--soft);flex-shrink:0}
.lvl-easy{color:#7FB5F2;border-color:#2B4A6E} .lvl-moderate{color:#4CC79A;border-color:#245A45} .lvl-hard{color:#F08A5D;border-color:#6A3A22}
.datechips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.datechips::-webkit-scrollbar{display:none}
.datechips button{flex-shrink:0;width:92px;min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:6px 10px;text-align:left}
.datechips button span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.datechips button[aria-pressed="true"]{border-color:var(--lime);background:#1D2414}
.datechips button[aria-pressed="true"] b{color:var(--lime)}

/* steps & lifts */
.step{display:flex;gap:12px;align-items:stretch}
.step .bar{width:6px;border-radius:3px;flex-shrink:0}
.step-name{font-weight:600}
.repeat .rep{font-size:12px;font-weight:700;color:var(--lime);letter-spacing:.4px}
.when{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;align-self:center}
.zt{display:flex;align-items:center;gap:10px;font-size:13px}
.zdot{width:10px;height:10px;border-radius:5px;flex-shrink:0}
.zt-bar{width:64px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex-shrink:0}
.zt-bar span{display:block;height:100%}
.zt-t{width:58px;text-align:right;font-variant-numeric:tabular-nums;color:var(--soft)}
.kv{display:flex;flex-direction:column;gap:2px}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pics figure{margin:0;position:relative}
.pics img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:10px;display:block;background:var(--card2)}
.pics figcaption{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;letter-spacing:.4px;background:rgba(14,17,22,.78);padding:2px 7px;border-radius:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:600;color:var(--soft);background:var(--card2);border:1px solid var(--line);padding:3px 8px;border-radius:999px}
.how{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--soft)}
details summary{font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;min-height:28px;display:flex;align-items:center}
pre{margin:10px 0 0;white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--soft)}
.warn-card{outline:1px solid #6A4A22}
.tipcard{background:#1D2414;outline:1px solid #3A4A1F;gap:4px}

/* data */
.stat-tile{gap:2px;padding:12px 14px}
.sv{font-size:22px;font-weight:700;line-height:1.2}
.sv.sm{font-size:18px}
.delta{font-size:11px;font-weight:600}
.delta.up{color:var(--good)} .delta.down{color:var(--amber)} .delta.neutral{color:var(--muted)}
.grid2.stats{gap:6px}
.grid3 .sv{font-size:18px;white-space:nowrap}
.loading-card{align-items:center}
.chart-card{gap:8px}
.cc-head{display:flex;flex-direction:column;gap:2px}
.chart{margin:0;position:relative;outline-offset:4px;display:flex;flex-direction:column;gap:6px}
.chart svg{width:100%;height:auto;display:block;touch-action:pan-y;overflow:visible}
.chart .ax{font-size:10px;fill:#9AA4B2;font-variant-numeric:tabular-nums}
.chart .bar{transition:opacity .15s}
.chart .bar.dim{opacity:.45}
.chart-empty{font-size:13px;color:var(--muted);padding:18px 0;text-align:center}
.ctip{position:absolute;top:24px;z-index:3;min-width:140px;max-width:220px;background:#0E1218;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.45);pointer-events:none;outline:0;gap:0}
.ctip[hidden]{display:none}
.ctip .th{color:var(--muted);font-weight:600;margin-bottom:4px}
.ctip .tr{display:flex;align-items:center;gap:6px;line-height:1.6}
.ctip .tr b{color:var(--text);font-variant-numeric:tabular-nums}
.ctip .tr span{color:var(--muted)}
.tbl-wrap{overflow-x:auto;margin:0 -14px;padding:0 14px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--hair);vertical-align:top}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tfoot td{font-weight:700;border-bottom:0}
.tbl td:not(:first-child){white-space:nowrap}
.tbl .tnote{font-size:11px;color:var(--muted);margin-top:2px}
.tbl.log tr[data-action]{cursor:pointer}
.tbl.log td:first-child{white-space:nowrap;position:sticky;left:0;background:var(--card)}
.tbl.log tbody tr:active td{background:var(--raise)}
.tbl.raw td:first-child{color:var(--muted);white-space:nowrap}
.mono{font:12px ui-monospace,Menlo,monospace}
.score-badge{font-weight:700;font-size:15px;padding:2px 10px;border-radius:8px;color:var(--lime-ink)}
.b-go{background:var(--lime)} .b-trim{background:var(--amber)} .b-easy,.b-rest{background:var(--red)}
.sources .btn{min-height:44px}

/* settings */
.sgroup{display:flex;flex-direction:column;gap:2px;border-radius:var(--r);overflow:hidden}
.srow{border-radius:0}
.srow .grow{display:flex;flex-direction:column}
.so-icon{width:34px;height:34px;border-radius:10px;background:var(--raise);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--soft)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px}
.toggle>span{display:flex;flex-direction:column;gap:2px}
.toggle input{width:24px;height:24px;accent-color:var(--lime);flex-shrink:0}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.sched select{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card2);padding:0 12px;color:var(--text);font-size:16px;width:100%;min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none}
.sched{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-weight:600}
.steps-help{margin:0;padding-left:18px;color:var(--soft);display:flex;flex-direction:column;gap:6px}
.stat{gap:4px}
.stat input{background:transparent;border:0;border-bottom:1px solid var(--line);font-size:26px;font-weight:700;width:100%;padding:0 0 2px;color:var(--text)}
.zone{flex-direction:row;align-items:center;gap:12px;padding:10px 12px}
.zbadge{width:36px;height:36px;border-radius:10px;color:var(--lime-ink);font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.zr{font-size:17px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}

/* editor */
.ed-step{display:flex;flex-direction:column;gap:8px;border-left:4px solid var(--line);padding-left:10px}
.repeat .ed-step{margin-top:4px}
.ed-row{display:flex;align-items:center;gap:8px}
.ed-row.wrap{flex-wrap:wrap}
.ed-row input[type=text]{flex:1;min-width:0;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);padding:0 10px;font-size:16px;font-weight:600}
.ed-row select{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);padding:0 8px;font-size:15px;min-width:0;flex:1}
.ed-row select[data-ef=sets]{flex:0 0 104px}
.ed-row select[data-ef=zone],.ed-row select[data-ef=pw]{flex:1 1 130px}
.dur{display:flex;align-items:center;gap:6px}
.dur input{width:60px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);text-align:center;font-size:16px}
.dur select{flex:0 0 auto;width:64px}
.reps{display:flex;align-items:center;gap:6px;flex:1 1 0;min-width:0}
.reps input{flex:1;min-width:0;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);padding:0 10px;font-size:16px}
.ed-btns{display:flex;gap:4px;flex-shrink:0}
.mini{width:36px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);display:flex;align-items:center;justify-content:center;padding:0}
.mini:disabled{opacity:.35}
.mini.danger{color:var(--red)}
.count{min-width:34px;text-align:center;font-size:20px}
.ed-thumb{width:56px;height:44px;object-fit:cover;border-radius:8px;flex-shrink:0}
.pick-link{align-self:flex-start;padding:2px 0}
.pick{display:flex;align-items:center;gap:12px;background:var(--card);border:0;border-radius:14px;padding:8px;text-align:left;width:100%;min-height:60px}
.pick img,.pick-ph{width:72px;height:48px;object-fit:cover;border-radius:8px;flex-shrink:0;background:var(--card2)}
.pick-ph{display:flex;align-items:center;justify-content:center;color:var(--lime)}
.pick .grow{display:flex;flex-direction:column}

/* sheet */
#sheet{position:fixed;inset:0;z-index:30}
#sheet[hidden]{display:none}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fade .15s}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom) + 12px);display:flex;flex-direction:column;gap:8px;max-height:88vh;overflow-y:auto;animation:rise .2s ease-out}
.sheet-panel h2{margin:4px 0 0;font-family:var(--display);font-size:24px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 6px}
.sheet-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.sheet-opt{display:flex;align-items:center;gap:12px;background:var(--card2);border:0;border-radius:14px;padding:10px 12px;min-height:58px;text-align:left;width:100%}
.sheet-opt .grow{display:flex;flex-direction:column}
@keyframes rise{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet-panel,.sheet-backdrop{animation:none}}

/* nav + toast */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(11,14,19,.96);border-top:1px solid var(--hair);padding:6px 4px calc(env(safe-area-inset-bottom) + 4px);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);z-index:10}
nav button{height:54px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600}
nav button[aria-current="page"],nav button[aria-current="true"]{color:var(--lime)}
nav>*{max-width:110px;width:100%;justify-self:center}
.toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 76px);max-width:488px;margin:0 auto;background:#F2F4F7;color:#0E1116;padding:12px 14px;border-radius:14px;font-size:14px;font-weight:500;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:40}
.toast.show{opacity:1;transform:none}
.toast.err{background:#FFD9DA}
</style>
</head>
<body>
<div id="progress" hidden aria-hidden="true"></div>
<main id="view" aria-live="polite"></main>
<nav aria-label="Main">
  <button data-action="go" data-view="today"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Today</button>
  <button data-action="go" data-view="plan"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</button>
  <button data-action="go" data-view="library"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg>Library</button>
  <button data-action="go" data-view="data"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>Data</button>
  <button data-action="go" data-view="settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</nav>
<div id="sheet" hidden></div>
<div id="toast" class="toast" role="status"></div>
<script>
/* Pace core: dates, zones, readiness, plan generation, adaptation, data
   summaries and Intervals.icu workout text. Pure functions only. */

const Z_COLORS = ['#8FA3BF', '#4EA8FF', '#3FD08A', '#FF9F43', '#FF5A5F'];
const Z_NAMES = ['Recovery', 'Endurance', 'Tempo', 'Threshold', 'Max effort'];
const Z_USES = ['Warm-ups, cool-downs, recoveries', 'Most runs, rides and hikes live here',
  'Comfortably hard, used sparingly', 'Intervals, 3–8 min repeats', 'Short all-out efforts, rarely'];
const Z_PCT = [0.6, 0.7, 0.8, 0.9, 1.0]; // upper bound of each HR zone, % of max HR

// Power zones as % of FTP (Zwift workouts). Level 5 = anything above threshold.
const PZ_TOPS = [55, 75, 90, 105];
const PZ_NAMES = ['Recovery', 'Endurance', 'Tempo', 'Threshold', 'Above threshold'];
const PZ_RANGES = ['under 55% FTP', '56–75% FTP', '76–90% FTP', '91–105% FTP', 'over 105% FTP'];
function pzLevel(pct) { for (let i = 0; i < PZ_TOPS.length; i++) if (pct <= PZ_TOPS[i]) return i + 1; return 5; }

// Chart palette for sports, validated for the dark card surface (#171B22).
const SPORT_CATS = {
  run: { label: 'Run', color: '#3987e5', types: ['Run', 'TrailRun', 'VirtualRun', 'Treadmill'] },
  ride: { label: 'Ride', color: '#d95926', types: ['Ride', 'VirtualRide', 'GravelRide', 'MountainBikeRide', 'EBikeRide', 'EMountainBikeRide', 'Velomobile', 'Handcycle'] },
  strength: { label: 'Strength', color: '#199e70', types: ['WeightTraining', 'Workout', 'Crossfit', 'HighIntensityIntervalTraining', 'Yoga', 'Pilates'] },
  other: { label: 'Hike & other', color: '#9085e9', types: null },
};
function catOf(type) {
  for (const k of ['run', 'ride', 'strength']) if (SPORT_CATS[k].types.includes(type)) return k;
  return 'other';
}

const SESSION_TYPES = {
  rest: { label: 'Rest', sport: null, group: 'Rest' },
  easyRun: { label: 'Easy run', sport: 'Run', group: 'Run' },
  qualityRun: { label: 'Run workout', sport: 'Run', group: 'Run' },
  longRun: { label: 'Long run', sport: 'Run', group: 'Run' },
  tmEasy: { label: 'Treadmill easy run', sport: 'Run', treadmill: true, group: 'Treadmill' },
  tmQuality: { label: 'Treadmill hills', sport: 'Run', treadmill: true, group: 'Treadmill' },
  easyRide: { label: 'Endurance ride', sport: 'Ride', group: 'Ride' },
  longRide: { label: 'Long ride', sport: 'Ride', group: 'Ride' },
  zwiftEasy: { label: 'Zwift endurance', sport: 'VirtualRide', indoor: true, group: 'Zwift' },
  zwiftQuality: { label: 'Zwift workout', sport: 'VirtualRide', indoor: true, group: 'Zwift' },
  hike: { label: 'Hike', sport: 'Hike', group: 'Hike' },
  longHike: { label: 'Long hike', sport: 'Hike', group: 'Hike' },
  liftA: { label: 'Lower body + core', sport: 'WeightTraining', group: 'Strength' },
  liftB: { label: 'Upper body + core', sport: 'WeightTraining', group: 'Strength' },
  liftC: { label: 'Full body', sport: 'WeightTraining', group: 'Strength' },
  liftRun: { label: "Runner's strength", sport: 'WeightTraining', group: 'Strength' },
  core: { label: 'Core & mobility', sport: 'WeightTraining', group: 'Strength' },
};
const TYPE_GROUPS = ['Run', 'Treadmill', 'Ride', 'Zwift', 'Hike', 'Strength', 'Rest'];

const DAY_KEYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
const DAY_SHORT = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

const DEFAULT_SCHEDULE = {
  mon: 'liftA', tue: 'easyRun', wed: 'easyRide', thu: 'liftB',
  fri: 'rest', sat: 'qualityRun', sun: 'longRide',
};

/* Strength routines. Each move: [name, reps, Free Exercise DB id, seconds per set]. */
const LIFTS = {
  liftA: { name: 'Lower body + core', focus: 'Lower body + core', moves: [
    ['Goblet squat', '10', 'Goblet_Squat'],
    ['Dumbbell Romanian deadlift', '10', 'Stiff-Legged_Dumbbell_Deadlift'],
    ['Reverse lunge', '8 each leg', 'Dumbbell_Rear_Lunge'],
    ['Single-leg glute bridge', '12 each leg', 'Single_Leg_Glute_Bridge'],
    ['Dead bug', '10 each side', 'Dead_Bug'],
  ] },
  liftB: { name: 'Upper body + core', focus: 'Upper body + core', moves: [
    ['Dumbbell floor press', '10', 'Dumbbell_Floor_Press'],
    ['One-arm dumbbell row', '10 each arm', 'One-Arm_Dumbbell_Row'],
    ['Standing overhead press', '8', 'Standing_Dumbbell_Press'],
    ['Dumbbell biceps curl', '12', 'Dumbbell_Bicep_Curl'],
    ['Side plank', '3 holds each side', 'Side_Bridge'],
  ] },
  liftC: { name: 'Full body', focus: 'Full body', moves: [
    ['Dumbbell squat', '10', 'Dumbbell_Squat'],
    ['Push-up', '8–12', 'Pushups'],
    ['Bent-over dumbbell row', '10', 'Bent_Over_Two-Dumbbell_Row'],
    ['Dumbbell step-up', '8 each leg', 'Dumbbell_Step_Ups'],
    ['Arnold press', '8', 'Arnold_Dumbbell_Press'],
    ['Plank', '30–45 sec hold', 'Plank', 90],
  ] },
  liftRun: { name: "Runner's strength", focus: 'Single-leg strength, calves, hips', moves: [
    ['Dumbbell split squat', '8 each leg', 'Split_Squat_with_Dumbbells'],
    ['Dumbbell Romanian deadlift', '10', 'Stiff-Legged_Dumbbell_Deadlift'],
    ['Standing calf raise', '15', 'Standing_Dumbbell_Calf_Raise', 90],
    ['Dumbbell step-up', '8 each leg', 'Dumbbell_Step_Ups'],
    ['Side plank', '30 sec each side', 'Side_Bridge', 90],
    ['Superman', '10 slow reps', 'Superman', 90],
  ] },
  core: { name: 'Core & mobility', focus: 'Core, hips and stretching', maxSets: 2, moves: [
    ['Plank', '30–45 sec hold', 'Plank', 75],
    ['Dead bug', '10 each side', 'Dead_Bug', 75],
    ['Side plank', '30 sec each side', 'Side_Bridge', 90],
    ['Russian twist', '12 each side', 'Russian_Twist', 75],
    ['Cat stretch', '8 slow reps', 'Cat_Stretch', 60],
    ['Kneeling hip flexor stretch', '30 sec each side', 'Kneeling_Hip_Flexor', 75],
    ["Child's pose", '45 sec', 'Childs_Pose', 60],
  ] },
  push: { name: 'Push day', focus: 'Chest, shoulders, triceps', moves: [
    ['Dumbbell floor press', '10', 'Dumbbell_Floor_Press'],
    ['Dumbbell shoulder press', '10', 'Dumbbell_Shoulder_Press'],
    ['Incline push-up', '10–15', 'Incline_Push-Up'],
    ['Side lateral raise', '12', 'Side_Lateral_Raise', 90],
    ['Dumbbell triceps kickback', '12 each arm', 'Tricep_Dumbbell_Kickback', 90],
  ] },
  pull: { name: 'Pull day', focus: 'Back, rear shoulders, biceps', moves: [
    ['Bent-over dumbbell row', '10', 'Bent_Over_Two-Dumbbell_Row'],
    ['One-arm dumbbell row', '10 each arm', 'One-Arm_Dumbbell_Row'],
    ['Reverse fly', '12', 'Reverse_Flyes', 90],
    ['Dumbbell shrug', '12', 'Dumbbell_Shrug', 90],
    ['Hammer curl', '10', 'Hammer_Curls', 90],
    ['Superman', '10 slow reps', 'Superman', 90],
  ] },
  legs: { name: 'Leg day', focus: 'Quads, hamstrings, glutes, calves', moves: [
    ['Goblet squat', '10', 'Goblet_Squat'],
    ['Dumbbell Romanian deadlift', '10', 'Stiff-Legged_Dumbbell_Deadlift'],
    ['Walking dumbbell lunge', '8 each leg', 'Dumbbell_Lunges'],
    ['Dumbbell step-up', '8 each leg', 'Dumbbell_Step_Ups'],
    ['Standing calf raise', '15', 'Standing_Dumbbell_Calf_Raise', 90],
    ['Glute bridge', '15', 'Butt_Lift_Bridge', 90],
  ] },
  stretch: { name: 'Post-run stretch', focus: 'Calves, hamstrings, quads, hips', maxSets: 1, moves: [
    ['Calf stretch', '30 sec each leg', 'Standing_Gastrocnemius_Calf_Stretch', 75],
    ['Hamstring stretch', '30 sec each leg', 'Hamstring_Stretch', 75],
    ['Quad stretch', '30 sec each leg', 'All_Fours_Quad_Stretch', 75],
    ['Kneeling hip flexor stretch', '30 sec each side', 'Kneeling_Hip_Flexor', 75],
    ['Lying glute stretch', '30 sec each side', 'Lying_Glute', 75],
    ["Child's pose", '45 sec', 'Childs_Pose', 60],
  ] },
  quick: { name: 'Quick 20-minute circuit', focus: 'Full body, minimal rest', maxSets: 3, moves: [
    ['Dumbbell squat', '12', 'Dumbbell_Squat', 70],
    ['Push-up', '10', 'Pushups', 70],
    ['Bent-over dumbbell row', '12', 'Bent_Over_Two-Dumbbell_Row', 70],
    ['Walking dumbbell lunge', '8 each leg', 'Dumbbell_Lunges', 70],
    ['Mountain climbers', '30 sec', 'Mountain_Climbers', 60],
  ] },
};

// Photos for these ship with the app; any other pick loads from the library.
const BUNDLED_EX = Array.from(new Set(Object.keys(LIFTS).reduce((a, k) => a.concat(LIFTS[k].moves.map(m => m[2])), [])));
function exImage(id, frame) {
  if (!id || !/^[A-Za-z0-9_\-()',.]+$/.test(id)) return '';
  return BUNDLED_EX.includes(id) ? 'img/ex/' + id + '/' + frame + '.jpg'
    : 'https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/' + encodeURIComponent(id) + '/' + frame + '.jpg';
}

const SPORT_MATCH = {
  Run: SPORT_CATS.run.types,
  Ride: SPORT_CATS.ride.types,
  VirtualRide: SPORT_CATS.ride.types,
  Hike: ['Hike', 'Walk'],
  WeightTraining: SPORT_CATS.strength.types,
};

/* ---------- dates (local, YYYY-MM-DD strings) ---------- */
function pad(n) { return String(n).padStart(2, '0'); }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseYmd(s) { const [y, m, d] = s.slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function daysBetween(a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }
function mondayOf(s) { const d = parseYmd(s); const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow); return ymd(d); }
function dayIndex(s) { return (parseYmd(s).getDay() + 6) % 7; } // 0 = Monday
function dateRange(from, to) { const out = []; for (let d = from; d <= to; d = addDays(d, 1)) out.push(d); return out; }

/* ---------- zones ---------- */
function estMaxHr(age) { return Math.round(220 - (Number(age) || 36)); }
function maxHrFor(settings) { return Number(settings.maxHr) > 0 ? Number(settings.maxHr) : estMaxHr(settings.age); }
function zoneTops(maxHr) { return Z_PCT.map(p => Math.round(maxHr * p)); }
function zoneRanges(maxHr) {
  const tops = zoneTops(maxHr);
  return tops.map((top, i) => ({ zone: i + 1, lo: i === 0 ? Math.round(maxHr * 0.5) : tops[i - 1], hi: top }));
}

/* ---------- formatting ---------- */
function fmtDur(sec) {
  sec = Math.round(sec || 0);
  const m = Math.floor(sec / 60), s = sec % 60;
  if (m >= 60) { const h = Math.floor(m / 60), mm = m % 60; return h + 'h' + (mm ? ' ' + mm + 'm' : ''); }
  return s ? m + ':' + pad(s) : m + ' min';
}
function fmtClock(sec) {
  sec = Math.round(sec || 0);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h ? h + ':' + pad(m) + ':' + pad(s) : m + ':' + pad(s);
}
function icuDur(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = Math.round(sec % 60);
  return (h ? h + 'h' : '') + (m ? m + 'm' : '') + (s ? s + 's' : '') || '0s';
}
function zoneLabel(z) { if (!z) return ''; return z[0] === z[1] ? 'Zone ' + z[0] : 'Zone ' + z[0] + '–' + z[1]; }
function zoneBpm(z, maxHr) {
  if (!z) return '';
  const r = zoneRanges(maxHr);
  const lo = r[z[0] - 1].lo, hi = r[z[1] - 1].hi;
  return z[0] === 1 ? 'under ' + hi + ' bpm' : lo + '–' + hi + ' bpm';
}
function pwLabel(st) {
  if (!st.pw) return '';
  const [lo, hi] = st.pw;
  return (st.ramp ? 'Ramp ' + lo + '→' + hi : lo === hi ? lo : lo + '–' + hi) + '% FTP';
}
function pwWatts(st, ftp) {
  if (!st.pw || !(ftp > 0)) return '';
  const w = st.pw.map(p => Math.round(ftp * p / 100));
  return w[0] === w[1] ? w[0] + ' W' : w[0] + (st.ramp ? '→' : '–') + w[1] + ' W';
}
function rpmLabel(st) { return st.rpm ? (Array.isArray(st.rpm) ? st.rpm[0] + '–' + st.rpm[1] : st.rpm) + ' rpm' : ''; }

/* ---------- session model ----------
   session = { date, type, sport, treadmill?, indoor?, name, summary, hard, focus?,

function fmtMin(sec) { return fmtDur(Math.round((sec || 0) / 60) * 60); }

  const steps = flatSteps(s.blocks).filter(x => stepLevel(x));

function liftLabel(b) { return b.move + ' ' + b.sets + '×' + b.reps; }
function clone(o) { return JSON.parse(JSON.stringify(o)); }

/* ---------- plan position ---------- */
function weekInfo(planStart, date) {
  const start = mondayOf(planStart || date);
  let w = Math.floor(daysBetween(start, date) / 7) + 1;
  if (w < 1) w = 1;
  const block = Math.floor((w - 1) / 12);
  const wib = ((w - 1) % 12) + 1;
  const deload = wib % 4 === 0;
  const phase = wib <= 4 ? 'Base building' : wib <= 8 ? 'Build' : 'Sharpen';
  return { week: w, block, wib, deload, phase, monday: addDays(start, (w - 1) * 7) };
}
function volumeFactor(wi) {

  if (wi.deload) f *= 0.7;

/* ---------- step helpers ---------- */
const hr = (label, sec, zone, kind) => ({ label, sec, zone, kind: kind || 'easy' });

/* ---------- builders ---------- */
function buildEndurance(type, date, wi, factor, settings) {
  const base = { easyRun: 25, longRun: 40, easyRide: 40, longRide: 55, tmEasy: 25, hike: 50, longHike: 90, zwiftEasy: 40 }[type];
  const min = round5(base * factor);
  const t = SESSION_TYPES[type];
  const z = easyZone(settings);
  const notes = [];
  let blocks;
  if (type === 'zwiftEasy') {
    blocks = [pw('Warm up', 600, 50, 65, { ramp: true, kind: 'warm' }), pw('Endurance', Math.max(10, min - 15) * 60, 65, 72, { rpm: [85, 95] }), pw('Cool down', 300, 50, 50, { kind: 'cool' })];
    notes.push('Steady endurance in ERG mode. Keep cadence smooth, 85–95 rpm.');
  } else if (t.sport === 'Hike') {
    blocks = [hr('Hike', min * 60, [1, 2])];
    notes.push(type === 'longHike' ? 'Bring water and a snack for anything over 90 minutes. Climbs can push you into Zone 3; slow down to stay under it.' : 'Keep it conversational. On climbs, shorten your stride to stay in Zone 1–2.');
  } else {
    blocks = [hr(t.sport === 'Ride' ? 'Steady' : 'Easy', min * 60, z)];
    if (t.sport === 'Run' && wi.block === 0 && wi.wib <= 4) notes.push('Walk breaks are fine. Staying under the Zone 2 ceiling is the goal.');
    if (t.treadmill) notes.push('Set the treadmill to 1% incline to mimic outdoor effort.');
  }
  return { date, type, sport: t.sport, treadmill: !!t.treadmill, indoor: !!t.indoor, hard: false, name: t.label, blocks, notes };
}

function buildQualityRun(date, wi, settings, treadmill) {
  const z = easyZone(settings);
  const warm = hr('Warm up', 600, [2, 2], 'warm');
  const cool = hr('Cool down', 480, [1, 1], 'cool');
  let reps, work, rec, name;
  if (treadmill) {
    if (wi.deload || wi.wib <= 3) {
      reps = wi.deload ? 4 : [4, 5, 6][wi.wib - 1];
      work = hr('Incline 5 percent', 120, [3, 3], 'work'); rec = hr('Flat, easy', 120, z, 'rec');
      name = 'Treadmill hills · ' + reps + ' × 2 min';
    } else if (wi.wib <= 7) {
      reps = [4, 5, 6][wi.wib - 5];
      work = hr('Incline 6 percent', 180, [4, 4], 'work'); rec = hr('Flat, easy', 120, [1, 1], 'rec');
      name = 'Treadmill hills · ' + reps + ' × 3 min';
    } else {
      reps = [3, 4, 4][wi.wib - 9];
      work = hr('Incline 6 percent', 300, [4, 4], 'work'); rec = hr('Flat, easy', 180, [1, 1], 'rec');
      name = 'Treadmill hills · ' + reps + ' × 5 min';
    }
  } else if (wi.deload || wi.wib <= 3) {
    reps = wi.deload ? 4 : [3, 4, 5][wi.wib - 1];
    work = hr('Pick up', 60, [3, 3], 'work'); rec = hr('Easy', 120, z, 'rec');
    name = 'Run · ' + reps + ' × 1 min pickups';
  } else if (wi.wib <= 7) {
    reps = [3, 4, 5][wi.wib - 5];
    work = hr('Work', 180, [4, 4], 'work'); rec = hr('Recover', 120, [1, 1], 'rec');
    name = 'Run · ' + reps + ' × 3 min';
  } else {
    reps = [3, 3, 4][wi.wib - 9];
    work = hr('Work', 300, [4, 4], 'work'); rec = hr('Recover', 180, [1, 1], 'rec');
    name = 'Run · ' + reps + ' × 5 min';
  }
  reps = Math.min(6, reps + wi.block);
  return {
    date, type: treadmill ? 'tmQuality' : 'qualityRun', sport: 'Run', treadmill: !!treadmill, hard: true,
    name: name.replace(/\d+ ×/, reps + ' ×'),
    blocks: [warm, { repeat: reps, label: treadmill ? 'Hills' : 'Intervals', steps: [work, rec] }, cool],
    notes: treadmill ? ['Start it from the Treadmill activity on your watch. Change the incline at each step.'] : [],
  };
}

function buildZwiftQuality(date, wi) {
  let reps, workMin, lo, hi, restMin, name;
  if (wi.deload) { reps = 3; workMin = 5; lo = 85; hi = 88; restMin = 3; name = 'Zwift · easy sweet spot'; }
  else if (wi.wib <= 3) { reps = 3; workMin = [6, 8, 10][wi.wib - 1]; lo = 88; hi = 93; restMin = 3; name = 'Zwift · sweet spot'; }
  else if (wi.wib <= 7) { reps = [2, 2, 3][wi.wib - 5]; workMin = [12, 15, 12][wi.wib - 5]; lo = 88; hi = 93; restMin = 4; name = 'Zwift · sweet spot'; }
  else { reps = [3, 4, 2][wi.wib - 9]; workMin = [8, 8, 15][wi.wib - 9]; lo = 95; hi = 100; restMin = 4; name = 'Zwift · threshold'; }
  reps = Math.min(5, reps + wi.block);
  return {
    date, type: 'zwiftQuality', sport: 'VirtualRide', indoor: true, hard: true,
    name: name + ' ' + reps + ' × ' + workMin + ' min',
    blocks: [
      pw('Warm up', 600, 50, 70, { ramp: true, kind: 'warm' }),
      { repeat: reps, label: 'Intervals', steps: [pw('Work', workMin * 60, lo, hi, { kind: 'work', rpm: [85, 95] }), pw('Recover', restMin * 60, 50, 55, { kind: 'rec' })] },
      pw('Cool down', 480, 50, 50, { kind: 'cool' }),

    notes: ['Ride it in ERG mode in Zwift. Targets follow your Zwift FTP.'],
  };
}

function liftBlocks(key, sets) {
  const lift = LIFTS[key];
  const n = Math.min(sets, lift.maxSets || 6);
  const blocks = [{ label: 'Warm up: easy movement', sec: 300, zone: null, kind: 'warm' }];
  lift.moves.forEach(([move, reps, ex, perSet]) => {
    const b = { label: '', sec: n * (perSet || 120), zone: null, kind: 'lift', move, sets: n, reps, ex, perSet: perSet || 120 };
    b.label = liftLabel(b);

}
function buildLift(type, date, wi) {
  const sets = wi.deload ? 2 : (wi.block === 0 && wi.wib <= 2 ? 2 : 3);
  const lift = LIFTS[type];
  const notes = type === 'core' ? ['Move slowly and breathe. Stretches are holds, not reps.'] : ['When you hit every rep on every set, go up 5 lb next time.'];
  return { date, type, sport: 'WeightTraining', hard: false, name: lift.name, focus: lift.focus, blocks: liftBlocks(type, sets), notes };
}

function restSession(date) { return { date, type: 'rest', sport: null, hard: false, name: 'Rest', blocks: [], notes: [] }; }

function buildSession(type, date, settings, opts) {
  opts = opts || {};
  const wi = weekInfo(settings.planStart, date);
  let factor = volumeFactor(wi);
  if (opts.holdProgression && !wi.deload && wi.wib > 1) factor = volumeFactor(Object.assign({}, wi, { wib: wi.wib - 1, deload: (wi.wib - 1) % 4 === 0 }));
  let s;
  if (!type || !SESSION_TYPES[type] || type === 'rest') s = restSession(date);
  else if (type === 'qualityRun') s = buildQualityRun(date, wi, settings, false);
  else if (type === 'tmQuality') s = buildQualityRun(date, wi, settings, true);
  else if (type === 'zwiftQuality') s = buildZwiftQuality(date, wi);
  else if (LIFTS[type]) s = buildLift(type, date, wi);
  else s = buildEndurance(type, date, wi, factor, settings);

  s.week = wi;
  s.adjusted = false;
  return s;
}

/* ---------- readiness ---------- */
function mean(a) { return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null; }
function sd(a) { const m = mean(a); return a.length > 1 ? Math.sqrt(a.reduce((t, x) => t + (x - m) * (x - m), 0) / (a.length - 1)) : null; }
const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));

/* Score = 70 + HRV + resting HR + sleep + form effects, kept within 5–100.
   Every effect is reported so the Data tab can show the math. */
function readiness(wellness, today) {
  const rows = (wellness || []).filter(r => r && r.id && r.id <= today).sort((a, b) => a.id < b.id ? -1 : 1);
  if (!rows.length) return null;
  const last = rows[rows.length - 1];
  if (daysBetween(last.id, today) > 1) return null;
  const prior = rows.filter(r => r.id < last.id);
  const vals = (key, days) => prior.filter(r => daysBetween(r.id, last.id) <= days && r[key] != null && r[key] > 0).map(r => r[key]);

  let score = 70; const reasons = []; const metrics = {}; const comps = [];
  if (last.hrv) {
    const b7 = mean(vals('hrv', 7)), b28 = vals('hrv', 28), m28 = mean(b28);
    // Day-to-day HRV normally swings ~8%; floor the spread so a very steady
    // baseline doesn't turn a small dip into a big score drop.
    const s28 = m28 ? Math.max(sd(b28) || 0, m28 * 0.08) : null;
    metrics.hrv = { value: Math.round(last.hrv), vs7: b7 ? (last.hrv - b7) / b7 : null };
    let pts = 0, note = 'Needs 5+ nights of history (' + b28.length + ' so far)';
    if (m28 && s28 && b28.length >= 5) {
      const z = (last.hrv - m28) / s28;
      pts = clamp(z * 10, -25, 15);
      note = (z >= 0 ? '+' : '') + z.toFixed(1) + ' SD vs 28-day baseline';
      if (metrics.hrv.vs7 != null && Math.abs(metrics.hrv.vs7) >= 0.05) reasons.push('HRV ' + Math.round(Math.abs(metrics.hrv.vs7) * 100) + '% ' + (metrics.hrv.vs7 < 0 ? 'below' : 'above') + ' your 7-day average');
    }
    score += pts;
    comps.push({ key: 'hrv', label: 'HRV (overnight)', value: Math.round(last.hrv) + ' ms', base: m28 ? Math.round(m28) + ' ms' : '—', pts, note });
  }
  if (last.restingHR) {
    const b7 = mean(vals('restingHR', 7));
    metrics.rhr = { value: Math.round(last.restingHR), delta: b7 ? last.restingHR - b7 : null };
    let pts = 0, note = 'Needs at least one earlier day';
    if (b7) {
      const d = last.restingHR - b7;
      pts = -clamp(d * 3, -6, 20);
      note = (d >= 0 ? '+' : '') + d.toFixed(1) + ' bpm vs 7-day average';
      if (d >= 3) reasons.push('Resting HR ' + Math.round(d) + ' bpm above normal');
    }
    score += pts;
    comps.push({ key: 'rhr', label: 'Resting HR', value: Math.round(last.restingHR) + ' bpm', base: b7 ? b7.toFixed(0) + ' bpm' : '—', pts, note });
  }
  if (last.sleepSecs) {
    const h = last.sleepSecs / 3600;
    metrics.sleep = { value: h };
    let pts = 0;
    if (h < 6) { pts = -15; reasons.push('Short sleep (' + h.toFixed(1) + ' h)'); }
    else if (h < 7) pts = -5;
    else if (h >= 8) pts = 5;
    score += pts;
    const b7 = mean(vals('sleepSecs', 7));
    comps.push({ key: 'sleep', label: 'Sleep', value: fmtHours(h), base: b7 ? fmtHours(b7 / 3600) : '—', pts, note: 'Under 6 h −15 · 6–7 h −5 · 7–8 h 0 · 8 h+ +5' });
  }
  if (last.ctl != null && last.atl != null) {
    const form = last.ctl - last.atl;
    metrics.form = { value: Math.round(form), ctl: Math.round(last.ctl), atl: Math.round(last.atl) };
    let pts = 0;
    if (form < -25) { pts = -10; reasons.push('Fatigue is high relative to fitness'); }
    else if (form < -15) pts = -5;
    else if (form > 5) pts = 5;
    score += pts;
    comps.push({ key: 'form', label: 'Form (fitness − fatigue)', value: (form >= 0 ? '+' : '') + Math.round(form), base: 'CTL ' + Math.round(last.ctl) + ' / ATL ' + Math.round(last.atl), pts, note: 'Below −25 −10 · −25 to −15 −5 · above +5 +5' });
  }
  if (!metrics.hrv && !metrics.rhr && !metrics.sleep) return null;
  const raw = score;
  score = Math.round(clamp(score, 5, 100));
  const band = score >= 65 ? 'go' : score >= 55 ? 'trim' : score >= 40 ? 'easy' : 'rest';
  const headline = { go: 'Ready, go as planned', trim: 'A little off, hard work trimmed', easy: 'Take it easy today', rest: 'Rest and recover today' }[band];
  return { score, raw, band, headline, reasons, metrics, comps, date: last.id };
}
function fmtHours(h) { return Math.floor(h) + 'h ' + pad(Math.round((h % 1) * 60) % 60) + 'm'; }
function readinessSeries(wellness, dates) { return dates.map(d => { const r = readiness(wellness, d); return r && r.date === d ? r.score : null; }); }
function rolling(values, n) {
  return values.map((_, i) => {
    const win = values.slice(Math.max(0, i - n + 1), i + 1).filter(v => v != null);
    return win.length >= Math.min(3, n) ? win.reduce((a, b) => a + b, 0) / win.length : null;
  });
}

/* ---------- adaptation ---------- */
function easyVersion(s, settings, frac) {
  const total = totalSec(s.blocks) * (frac || 0.8);
  const min = round5(total / 60);
  if (s.sport === 'VirtualRide') return [pw('Warm up', 300, 50, 60, { ramp: true, kind: 'warm' }), pw('Endurance', Math.max(10, min - 10) * 60, 60, 70, { rpm: [85, 95] }), pw('Cool down', 300, 50, 50, { kind: 'cool' })];
  return [hr('Easy', min * 60, s.sport === 'Hike' ? [1, 2] : easyZone(settings))];
}

function adapt(session, r, settings) {
  if (!r || session.type === 'rest' || r.band === 'go') return session;
  const s = clone(session);
  const why = r.reasons.length ? r.reasons[0] : 'Readiness ' + r.score;
  const finish = () => { s.summary = summarize(s); s.adjusted = true; return s; };
  if (r.band === 'rest') {
    if (s.sport === 'WeightTraining') {
      return Object.assign(s, { type: 'rest', sport: null, name: 'Rest (was ' + session.name + ')', summary: 'Optional 10 min mobility', blocks: [], hard: false, adjusted: true,
        notes: [why + ', so strength moves to another day.'] });
    }
    if (s.sport === 'VirtualRide') {
      Object.assign(s, { name: 'Recovery spin', hard: false, blocks: [pw('Easy spin', 1200, 45, 55, { rpm: [85, 95] })], notes: [why + ', so today is an optional 20 min easy spin.'] });
      return finish();
    }
    const label = s.sport === 'Hike' ? 'Easy walk' : s.sport === 'Ride' ? 'Recovery spin' : 'Recovery walk or jog';
    Object.assign(s, { name: (s.treadmill ? 'Treadmill ' : '') + label, hard: false, blocks: [hr('Recovery', 1200, [1, 1])], notes: [why + ', so today is an optional 20 min in Zone 1.'] });
    return finish();
  }
  if (s.sport === 'WeightTraining') {
    if (r.band === 'easy') {
      s.blocks.forEach(b => { if (b.kind === 'lift' && b.sets > 2) { b.sets -= 1; b.sec = b.sets * (b.perSet || 120); b.label = liftLabel(b); } });
      s.notes.unshift(why + ', so one set comes off each exercise.');
      return finish();
    }
    return s;
  }
  if (s.hard) {
    const rep = s.blocks.find(b => b.repeat);
    if (r.band === 'trim' && rep && rep.repeat > 2) {
      const before = rep.repeat;
      rep.repeat -= 1;
      rep.steps[rep.steps.length - 1].sec += 60;
      s.name = s.name.replace(new RegExp('\\b' + before + ' ×'), rep.repeat + ' ×');
      s.notes.unshift(why + ', so we cut ' + before + ' repeats to ' + rep.repeat + ' and added a minute to each recovery.');
      return finish();
    }
    if (r.band === 'trim' && !rep) {
      eachStep(s.blocks, x => { if (stepLevel(x) >= 3) x.sec = Math.max(60, Math.round(x.sec * 0.75 / 30) * 30); });
      s.notes.unshift(why + ', so the hard part is 25% shorter.');
      return finish();
    }
    const label = s.sport === 'VirtualRide' ? 'Zwift endurance (swapped)' : (s.treadmill ? 'Treadmill easy run' : 'Easy run') + ' (swapped)';
    Object.assign(s, { name: label, hard: false, blocks: easyVersion(s, settings, 0.8),
      notes: [why + ', so the intervals became ' + (s.sport === 'VirtualRide' ? 'an easy endurance ride.' : 'an easy Zone 2 run.')] });
    return finish();
  }
  if (r.band === 'easy') {
    eachStep(s.blocks, x => { x.sec = x.sec >= 600 ? round5((x.sec / 60) * 0.8) * 60 : x.sec; });
    s.notes.unshift(why + ', so this is about 20% shorter.');
    return finish();
  }
  return s;
}

/* ---------- conversions (indoors / outdoors / easier) ---------- */
const HR_TO_PW = { 1: [45, 55], 2: [60, 70], 3: [76, 85], 4: [91, 100], 5: [106, 115] };
function toIndoor(s) {
  const o = clone(s);
  if (o.sport === 'Run' && !o.treadmill) {
    o.treadmill = true; o.name = 'Treadmill · ' + o.name.replace(/^Run · /, '');
    o.notes = ['Start it from the Treadmill activity on your watch. Set 1% incline for easy running.'].concat(o.notes || []);
  } else if (o.sport === 'Ride') {
    o.sport = 'VirtualRide'; o.indoor = true; o.name = 'Zwift · ' + o.name;
    const conv = st => { if (st.zone) { st.pw = HR_TO_PW[st.zone[1]].slice(); delete st.zone; } return st; };
    o.blocks.forEach(b => { if (b.repeat) b.steps.forEach(conv); else conv(b); });
    o.notes = ['Converted from heart rate zones to power for Zwift ERG mode.'].concat(o.notes || []);
  } else return null;
  o.summary = summarize(o);
  return o;
}
function toOutdoor(s, settings) {
  const o = clone(s);
  if (o.treadmill) { o.treadmill = false; o.name = o.name.replace(/^Treadmill · /, 'Run · ').replace(/^Treadmill /, ''); o.notes = (o.notes || []).filter(n => !/Treadmill|incline/.test(n)); }
  else if (o.sport === 'VirtualRide') {
    o.sport = 'Ride'; o.indoor = false; o.name = o.name.replace(/^Zwift · /, '').replace(/^Zwift /, '') || 'Ride';
    const conv = st => { if (st.pw) { const l = pzLevel(Math.max(st.pw[0], st.pw[1])); st.zone = l <= 2 ? easyZone(settings) : [l, l]; delete st.pw; delete st.ramp; delete st.rpm; } return st; };
    o.blocks.forEach(b => { if (b.repeat) b.steps.forEach(conv); else conv(b); });
    o.notes = ['Converted from power to heart rate zones for riding outside.'];
  } else return null;
  o.summary = summarize(o);
  return o;
}

/* ---------- completion ---------- */

    return new Date(y, m - 1, dd).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }
  function tickFmt(v) { return Math.abs(v) >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0) + 'K' : String(+v.toFixed(1)); }

  function frame(id, H, y, labels, xs, aria) {
    let g = '';
    y.ticks.forEach(t => {
      const yy = y.at(t);
      g += '<line x1="' + PL + '" x2="' + (W - PR) + '" y1="' + yy + '" y2="' + yy + '" stroke="' + GRID + '" stroke-width="1" vector-effect="non-scaling-stroke"/>' +
        '<text x="' + (PL - 6) + '" y="' + (yy + 3.5) + '" text-anchor="end" class="ax">' + esc((y.fmt || tickFmt)(t)) + '</text>';
    });
    const n = labels.length, picks = n <= 1 ? [0] : n <= 3 ? labels.map((_, i) => i) : [0, Math.round((n - 1) / 2), n - 1];
    picks.forEach((i, k) => {
      const anchor = picks.length > 1 && k === 0 ? 'start' : picks.length > 1 && k === picks.length - 1 ? 'end' : 'middle';
      g += '<text x="' + xs(i) + '" y="' + (H - 6) + '" text-anchor="' + anchor + '" class="ax">' + esc(labels[i]) + '</text>';
    });
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(aria) + '">' + g;
  }
  function yScale(min, max, H, count, fmt) {
    const t = nice(min, max, count || 3), top = PT, bot = H - PB;
    return { ticks: t.ticks, lo: t.lo, hi: t.hi, fmt, at: v => +(bot - (v - t.lo) / (t.hi - t.lo) * (bot - top)).toFixed(2) };
  }
  function legend(items, kind) {
    if (items.length < 2) return '';
    return '<div class="lg">' + items.map(s => '<span><i class="' + (kind || 'ln') + '" style="background:' + s.color + '"></i>' + esc(s.name) + '</span>').join('') + '</div>';
  }
  function wrap(id, inner, aria, extra) {
    return '<figure class="chart" data-chart="' + id + '" tabindex="0" aria-label="' + esc(aria) + ' Use arrow keys to read values.">' + (extra || '') + inner + '<div class="ctip" hidden></div></figure>';
  }
  const has = v => v != null && isFinite(v);

  /* line: {dates, series:[{name,color,values}], band?:{lo,hi,color,name}, fmt, unit, height, yMin, yMax, aria} */
  function line(cfg) {
    const id = 'c' + (++seq), H = cfg.height || 150, n = cfg.dates.length;
    const all = [];
    cfg.series.forEach(s => s.values.forEach(v => { if (has(v)) all.push(v); }));
    if (cfg.band) cfg.band.lo.concat(cfg.band.hi).forEach(v => { if (has(v)) all.push(v); });
    if (!all.length) return '<div class="chart-empty">No data in this range yet.</div>';
    let min = Math.min.apply(null, all), max = Math.max.apply(null, all);
    const pad = (max - min) * 0.1 || 1;
    min = cfg.yMin != null ? cfg.yMin : min - pad; max = cfg.yMax != null ? cfg.yMax : max + pad;
    const y = yScale(min, max, H, 3, cfg.tick);
    const step = n > 1 ? (W - PL - PR) / (n - 1) : 0, xs = i => +(PL + i * step).toFixed(2);
    let svg = frame(id, H, y, cfg.dates.map(shortDate), xs, cfg.aria);
    if (cfg.band) {
      let seg = [];
      const flush = () => {
        if (seg.length > 1) svg += '<path d="M' + seg.map(i => xs(i) + ',' + y.at(cfg.band.hi[i])).join('L') + 'L' + seg.slice().reverse().map(i => xs(i) + ',' + y.at(cfg.band.lo[i])).join('L') + 'Z" fill="' + cfg.band.color + '" fill-opacity="0.12"/>';
        seg = [];
      };
      for (let i = 0; i < n; i++) { if (has(cfg.band.lo[i]) && has(cfg.band.hi[i])) seg.push(i); else flush(); }
      flush();
    }
    cfg.series.forEach(s => {
      let d = '', pen = false, last = -1;
      s.values.forEach((v, i) => { if (has(v)) { d += (pen ? 'L' : 'M') + xs(i) + ',' + y.at(v); pen = true; last = i; } else pen = false; });
      svg += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
      s.values.forEach((v, i) => { if (has(v) && !has(s.values[i - 1]) && !has(s.values[i + 1])) svg += '<circle cx="' + xs(i) + '" cy="' + y.at(v) + '" r="2.5" fill="' + s.color + '"/>'; });
      if (last >= 0) svg += '<circle cx="' + xs(last) + '" cy="' + y.at(s.values[last]) + '" r="4" fill="' + s.color + '" stroke="' + SURF + '" stroke-width="2"/>';
    });
    svg += '<line class="xh" x1="0" x2="0" y1="' + PT + '" y2="' + (H - PB) + '" stroke="' + AXIS + '" stroke-width="1" vector-effect="non-scaling-stroke" visibility="hidden"/>';
    svg += '<g class="hdots"></g><rect class="hit" x="' + PL + '" y="0" width="' + (W - PL - PR) + '" height="' + (H - PB) + '" fill="transparent"/></svg>';
    REG[id] = { kind: 'line', n, xs, y, H, dates: cfg.dates, series: cfg.series, band: cfg.band, fmt: cfg.fmt };
    const items = cfg.series.map(s => ({ name: s.name, color: s.color }));
    if (cfg.band) items.push({ name: cfg.band.name, color: cfg.band.color, band: true });
    return wrap(id, svg, cfg.aria, cfg.series.length > 1 || cfg.band ? '<div class="lg">' + items.map(s => '<span><i class="' + (s.band ? 'bd' : 'ln') + '" style="background:' + s.color + '"></i>' + esc(s.name) + '</span>').join('') + '</div>' : '');
  }

  function barPath(x, y0, y1, w, r) {
    // column from baseline y0 to data end y1, rounded only at the data end
    const up = y1 < y0, h = Math.abs(y0 - y1);
    r = Math.min(r, w / 2, h);
    if (h < 0.5) return '';
    if (r < 1) return 'M' + x + ',' + y0 + 'h' + w + 'V' + y1 + 'h' + (-w) + 'Z';
    return up
      ? 'M' + x + ',' + y0 + 'V' + (y1 + r) + 'Q' + x + ',' + y1 + ' ' + (x + r) + ',' + y1 + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y1 + ' ' + (x + w) + ',' + (y1 + r) + 'V' + y0 + 'Z'
      : 'M' + x + ',' + y0 + 'V' + (y1 - r) + 'Q' + x + ',' + y1 + ' ' + (x + r) + ',' + y1 + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y1 + ' ' + (x + w) + ',' + (y1 - r) + 'V' + y0 + 'Z';
  }

  /* columns: {dates|labels, values, color | colorFn, fmt, height, diverging, aria, ref:{v,label}} */
  function columns(cfg) {
    const id = 'c' + (++seq), H = cfg.height || 130, labels = cfg.labels || cfg.dates.map(shortDate), n = labels.length;
    const vals = cfg.values.filter(has);
    if (!vals.length) return '<div class="chart-empty">No data in this range yet.</div>';
    let min = Math.min(0, Math.min.apply(null, vals)), max = Math.max(0, Math.max.apply(null, vals));
    if (cfg.ref) max = Math.max(max, cfg.ref.v);
    const y = yScale(min, max * 1.05 || 1, H, 3, cfg.tick);
    const band = (W - PL - PR) / n, bw = Math.max(1, Math.min(24, band - (band > 6 ? 2 : 1))), xs = i => +(PL + band * i + band / 2).toFixed(2);
    let svg = frame(id, H, y, labels, xs, cfg.aria);
    if (cfg.ref) svg += '<line x1="' + PL + '" x2="' + (W - PR) + '" y1="' + y.at(cfg.ref.v) + '" y2="' + y.at(cfg.ref.v) + '" stroke="' + AXIS + '" stroke-opacity=".6" stroke-width="1" vector-effect="non-scaling-stroke"/><text x="' + (W - PR) + '" y="' + (y.at(cfg.ref.v) - 4) + '" text-anchor="end" class="ax">' + esc(cfg.ref.label) + '</text>';
    const y0 = y.at(0);
    cfg.values.forEach((v, i) => {
      if (!has(v) || v === 0) return;
      const col = cfg.colorFn ? cfg.colorFn(v) : cfg.color;
      svg += '<path class="bar" data-i="' + i + '" d="' + barPath(+(xs(i) - bw / 2).toFixed(2), y0, y.at(v), bw, 4) + '" fill="' + col + '"/>';
    });
    if (min < 0) svg += '<line x1="' + PL + '" x2="' + (W - PR) + '" y1="' + y0 + '" y2="' + y0 + '" stroke="' + AXIS + '" stroke-width="1" vector-effect="non-scaling-stroke"/>';
    svg += '<rect class="hit" x="' + PL + '" y="0" width="' + (W - PL - PR) + '" height="' + (H - PB) + '" fill="transparent"/></svg>';
    REG[id] = { kind: 'bars', n, xs: i => xs(i), band, labels: cfg.dates || labels, values: cfg.values, fmt: cfg.fmt, name: cfg.name, colorFn: cfg.colorFn, color: cfg.color };
    return wrap(id, svg, cfg.aria, cfg.legend ? legend(cfg.legend, 'sq') : '');
  }

  /* stacked: {labels, keys:[{key,label,color}], rows:[{...}], fmt, tick, aria} */
  function stacked(cfg) {
    const id = 'c' + (++seq), H = cfg.height || 150, n = cfg.labels.length;
    const totals = cfg.rows.map(r => cfg.keys.reduce((a, k) => a + (r[k.key] || 0), 0));
    if (!totals.some(t => t > 0)) return '<div class="chart-empty">No activities in this range yet.</div>';
    const y = yScale(0, Math.max.apply(null, totals) * 1.05, H, 3, cfg.tick);
    const band = (W - PL - PR) / n, bw = Math.min(24, band - 2), xs = i => +(PL + band * i + band / 2).toFixed(2);
    let svg = frame(id, H, y, cfg.labels, xs, cfg.aria);
    cfg.rows.forEach((r, i) => {
      let base = 0;
      const segs = cfg.keys.filter(k => (r[k.key] || 0) > 0);
      segs.forEach((k, j) => {
        const v = r[k.key], top = j === segs.length - 1;
        const yb = y.at(base) - (j ? 1 : 0), yt = y.at(base + v) + (top ? 0 : 1); // 2px surface gap between segments
        if (yb - yt > 0.5) svg += '<path class="bar" data-i="' + i + '" d="' + (top ? barPath(+(xs(i) - bw / 2).toFixed(2), yb, yt, bw, 4) : 'M' + (xs(i) - bw / 2) + ',' + yb + 'h' + bw + 'V' + yt + 'h' + (-bw) + 'Z') + '" fill="' + k.color + '"/>';
        base += v;
      });
    });
    svg += '<rect class="hit" x="' + PL + '" y="0" width="' + (W - PL - PR) + '" height="' + (H - PB) + '" fill="transparent"/></svg>';
    REG[id] = { kind: 'stack', n, xs, labels: cfg.labels, rows: cfg.rows, keys: cfg.keys, fmt: cfg.fmt, totals };
    return wrap(id, svg, cfg.aria, legend(cfg.keys.map(k => ({ name: k.label, color: k.color })), 'sq'));
  }

  /* ---------- interaction ---------- */
  function row(color, value, name, kind) {
    const r = document.createElement('div'); r.className = 'tr';
    const k = document.createElement('i'); k.className = kind || 'ln'; k.style.background = color;
    const b = document.createElement('b'); b.textContent = value;
    const s = document.createElement('span'); s.textContent = name;
    r.append(k, b, s); return r;
  }
  function show(fig, i) {
    const c = REG[fig.dataset.chart]; if (!c) return;
    i = Math.max(0, Math.min(c.n - 1, i)); fig._i = i;
    const tip = fig.querySelector('.ctip'), svg = fig.querySelector('svg');
    tip.textContent = '';
    const h = document.createElement('div'); h.className = 'th';
    h.textContent = c.kind === 'stack' ? 'Week of ' + c.labels[i] : (c.dates ? new Date(c.dates[i] + 'T12:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }) : c.labels[i]);
    tip.appendChild(h);
    if (c.kind === 'line') {
      const xh = svg.querySelector('.xh'), x = c.xs(i);
      xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.setAttribute('visibility', 'visible');
      const dots = svg.querySelector('.hdots'); dots.innerHTML = '';
      c.series.forEach(s => {
        const v = s.values[i];
        tip.appendChild(row(s.color, has(v) ? c.fmt(v) : '—', s.name));
        if (has(v)) {
          const d = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          d.setAttribute('cx', x); d.setAttribute('cy', c.y.at(v)); d.setAttribute('r', 4); d.setAttribute('fill', s.color); d.setAttribute('stroke', SURF); d.setAttribute('stroke-width', 2);
          dots.appendChild(d);
        }
      });
      if (c.band && has(c.band.lo[i])) tip.appendChild(row(c.band.color, c.fmt(c.band.lo[i]) + '–' + c.fmt(c.band.hi[i]), c.band.name, 'bd'));
    } else if (c.kind === 'bars') {
      const v = c.values[i];
      tip.appendChild(row(has(v) ? (c.colorFn ? c.colorFn(v) : c.color) : AXIS, has(v) ? c.fmt(v) : '—', c.name || '', 'sq'));
    } else {
      c.keys.slice().reverse().forEach(k => { const v = c.rows[i][k.key] || 0; if (v) tip.appendChild(row(k.color, c.fmt(v), k.label, 'sq')); });
      tip.appendChild(row('transparent', c.fmt(c.totals[i]), 'Total', 'sq'));
    }
    svg.querySelectorAll('.bar').forEach(b => b.classList.toggle('dim', c.kind !== 'line' && +b.dataset.i !== i));
    tip.hidden = false;
    const rect = svg.getBoundingClientRect(), px = c.xs(i) * rect.width / W;
    const tw = tip.offsetWidth, fw = fig.clientWidth;
    let left = px + 12;
    if (left + tw > fw - 4) left = px - tw - 12;
    tip.style.left = Math.max(4, left) + 'px';
  }
  function hide(fig) {
    const tip = fig.querySelector('.ctip'), svg = fig.querySelector('svg');
    if (tip) tip.hidden = true;
    if (!svg) return;
    const xh = svg.querySelector('.xh'); if (xh) xh.setAttribute('visibility', 'hidden');
    const d = svg.querySelector('.hdots'); if (d) d.innerHTML = '';
    svg.querySelectorAll('.bar.dim').forEach(b => b.classList.remove('dim'));
  }
  function indexAt(fig, clientX) {
    const c = REG[fig.dataset.chart], svg = fig.querySelector('svg'), rect = svg.getBoundingClientRect();
    const x = (clientX - rect.left) * W / rect.width;
    if (c.kind === 'line') return Math.round((x - PL) / ((W - PL - PR) / Math.max(1, c.n - 1)));
    return Math.floor((x - PL) / ((W - PL - PR) / c.n));
  }
  function bind(root) {
    root.querySelectorAll('figure.chart').forEach(fig => {
      const svg = fig.querySelector('svg'); if (!svg) return;
      const move = e => show(fig, indexAt(fig, e.clientX));
      svg.addEventListener('pointermove', move);
      svg.addEventListener('pointerdown', move);
      svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(fig); });
      fig.addEventListener('keydown', e => {
        const c = REG[fig.dataset.chart]; if (!c) return;
        if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); show(fig, (fig._i == null ? c.n - 1 : fig._i + (e.key === 'ArrowRight' ? 1 : -1))); }
        if (e.key === 'Escape') hide(fig);
      });
      fig.addEventListener('blur', () => hide(fig));
    });
  }
  document.addEventListener('pointerdown', e => {
    document.querySelectorAll('figure.chart').forEach(f => { if (!f.contains(e.target)) hide(f); });
  });

  return { line, columns, stacked, bind, reset, shortDate };
})();
