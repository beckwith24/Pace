<title>Pace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0E1116;--card:#171B22;--card2:#11151B;--line:#2A303A;--hair:#222832;
  --text:#F2F4F7;--muted:#9AA4B2;--soft:#D5DAE1;
  --lime:#C6F432;--amber:#FFB066;--red:#FF6B6F;
  --z1:#8FA3BF;--z2:#4EA8FF;--z3:#3FD08A;--z4:#FF9F43;--z5:#FF5A5F;
  --display:'Barlow Condensed',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#view{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 104px);display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.top .grow{flex:1}
h1{margin:0;font-family:var(--display);font-size:38px;font-weight:700;letter-spacing:.3px;line-height:1.05}
h1.h-sm{font-size:28px}
.sub{font-size:13px;color:var(--muted);font-weight:500}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.flat{gap:12px}
.eyebrow{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.8px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px;color:var(--muted)} .center{text-align:center}
.pill{font-size:11px;font-weight:700;color:#0E1116;padding:4px 8px;border-radius:8px;white-space:nowrap}
.pill.amber{background:var(--amber)} .pill.red{background:var(--red)}
.link{background:none;border:0;padding:8px 0;color:var(--lime);font-weight:600;font-size:13px}
.banner{background:#1D2414;border:1px solid #3A4A1F;border-radius:14px;padding:10px 12px;font-size:13px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.banner .link{padding:0}
.banner.err{background:#2A1517;border-color:#5A2A2E}
.btn{height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.primary{background:var(--lime);border:0;color:#0E1116;font-weight:700;font-size:16px}
.btn:disabled{opacity:.6}
.ready{flex-direction:row;align-items:center;gap:16px}
.ring{width:84px;height:84px;border-radius:50%;padding:7px;flex-shrink:0}
.ring>div{width:100%;height:100%;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-family:var(--display);font-size:30px;line-height:1}
.ring span{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.6px}
.ready-body{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.ready-head{font-weight:600}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.metric{display:flex;flex-direction:column}
.ml{font-size:11px;color:var(--muted)} .mv{font-weight:600} .ms{font-size:11px;color:var(--muted)} .ms.warn{color:var(--amber)}
.sess{display:flex;gap:12px;align-items:center}
.sess-icon{width:44px;height:44px;border-radius:12px;background:#24301A;color:var(--lime);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sess-name{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.05}
.shape{display:flex;gap:2px;align-items:flex-end}
.shape>div{border-radius:3px;min-width:2px}
.why{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--soft)}
.why svg{color:var(--amber);flex-shrink:0;margin-top:1px}
.why.calm svg{color:var(--muted)}
.note-card{flex-direction:row;align-items:flex-start;font-size:13px;color:var(--soft)}
.note-card svg{flex-shrink:0;color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:8px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0;background:var(--card);border:0;border-radius:12px;min-height:64px}
.day .dn{font-size:11px;color:var(--muted)} .day .dt{font-size:12px;font-weight:600}
.day .dot{width:6px;height:6px;border-radius:3px}
.day.on{background:var(--lime);color:#0E1116} .day.on .dn{color:#0E1116;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card);border-radius:12px;padding:4px}
.seg button{height:40px;border:0;border-radius:9px;background:transparent;color:#B8C0CC;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--lime);color:#0E1116;font-weight:700}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:12px;background:var(--card);border:0;border-radius:14px;padding:10px 12px;min-height:56px;text-align:left;width:100%}
.li.on{background:#1D2414;outline:1px solid var(--lime)}
.li-day{width:36px;font-size:12px;color:var(--muted);font-weight:600}
.li.on .li-day{color:var(--lime)}
.li-main{flex:1;display:flex;flex-direction:column;min-width:0}
.li-name{font-weight:600;font-size:14px}
.ok{color:var(--lime);display:flex}
.bullet{display:flex;gap:8px;font-size:13px;color:var(--soft)}
.bullet.warn>span:first-child{color:var(--amber)} .bullet.good>span:first-child{color:var(--lime)} .bullet.info>span:first-child{color:var(--muted)}
.step{display:flex;gap:12px;align-items:stretch}
.step .bar{width:6px;border-radius:3px;flex-shrink:0}
.step-name{font-weight:600}
.repeat .rep{font-size:12px;font-weight:700;color:var(--lime)}
.kv{display:flex;flex-direction:column;gap:2px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px}
.toggle>span{display:flex;flex-direction:column;gap:2px}
.toggle input{width:24px;height:24px;accent-color:var(--lime);flex-shrink:0}
details summary{font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;min-height:24px}
pre{margin:10px 0 0;white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--soft)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{gap:4px}
.stat input{background:transparent;border:0;border-bottom:1px solid var(--line);font-family:var(--display);font-size:30px;font-weight:700;width:100%;padding:0 0 2px;color:var(--text)}
.big{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.2}
.big small{font-size:15px;color:var(--muted)}
.zone{flex-direction:row;align-items:center;gap:12px;padding:10px 12px}
.zbadge{width:36px;height:36px;border-radius:10px;color:#0E1116;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.zr{font-family:var(--display);font-size:20px;font-weight:600;white-space:nowrap}
.grow{flex:1;min-width:0}
.warn-card{outline:1px solid #6A4A22}
.tip{background:#1D2414;outline:1px solid #3A4A1F;gap:4px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.field input,.sched select{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card2);padding:0 12px;color:var(--text);font-size:16px;width:100%;min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none}
.sched{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-weight:600}
.steps-help{margin:0;padding-left:18px;color:var(--soft);display:flex;flex-direction:column;gap:4px}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(14,17,22,.96);border-top:1px solid var(--hair);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
nav button{height:54px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600}
nav button[aria-current="page"]{color:var(--lime)}
nav>*{max-width:120px;width:100%;justify-self:center}
.pill.blue{background:var(--z2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.small-btn{height:42px;font-size:14px}
.when{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;align-self:center}
.zt{display:flex;align-items:center;gap:10px;font-size:13px}
.zdot{width:10px;height:10px;border-radius:5px;flex-shrink:0}
.zt-bar{width:70px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex-shrink:0}
.zt-bar span{display:block;height:100%}
.zt-t{width:58px;text-align:right;font-variant-numeric:tabular-nums;color:var(--soft)}
.ed-step{display:flex;flex-direction:column;gap:8px;border-left:4px solid var(--line);padding-left:10px}
.repeat .ed-step{margin-top:4px}
.ed-row{display:flex;align-items:center;gap:8px}
.ed-row.wrap{flex-wrap:wrap}
.ed-row input[type=text]{flex:1;min-width:0;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);padding:0 10px;font-size:16px;font-weight:600}
.ed-row select{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);padding:0 8px;font-size:15px;min-width:0;flex:1}
.dur{display:flex;align-items:center;gap:6px}
.dur input{width:60px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);text-align:center;font-size:16px}
.dur select{flex:0 0 auto;width:64px}
.ed-row select[data-ef=sets]{flex:0 0 104px}
.ed-row select[data-ef=zone]{flex:1 1 120px}
.reps{display:flex;align-items:center;gap:6px;flex:1 1 0;min-width:0}
.reps input{flex:1;min-width:0;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);padding:0 10px;font-size:16px}
.ed-btns{display:flex;gap:4px;flex-shrink:0}
.mini{width:36px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);display:flex;align-items:center;justify-content:center;padding:0}
.mini:disabled{opacity:.35}
.mini.danger{color:var(--red)}
.count{min-width:34px;text-align:center;font-family:var(--display);font-size:22px}
.field select{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card2);padding:0 12px;color:var(--text);font-size:16px;width:100%}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pics figure{margin:0;position:relative}
.pics img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:10px;display:block;background:var(--card2)}
.pics figcaption{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;letter-spacing:.4px;background:rgba(14,17,22,.78);padding:2px 7px;border-radius:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:600;color:var(--soft);background:var(--card2);border:1px solid var(--line);padding:3px 8px;border-radius:999px}
.how{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--soft)}
.thumbs{display:flex;gap:6px}
.thumbs img{width:56px;height:40px;object-fit:cover;border-radius:8px;background:var(--card2)}
.ed-thumb{width:56px;height:44px;object-fit:cover;border-radius:8px;flex-shrink:0}
.pick-link{align-self:flex-start;padding:2px 0}
.search{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;color:var(--text);width:100%;-webkit-appearance:none;appearance:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{flex-shrink:0;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:#B8C0CC;font-size:13px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:#0E1116}
.pick{display:flex;align-items:center;gap:12px;background:var(--card);border:0;border-radius:14px;padding:8px;text-align:left;width:100%;min-height:60px}
.pick img,.pick-ph{width:72px;height:48px;object-fit:cover;border-radius:8px;flex-shrink:0;background:var(--card2)}
.pick-ph{display:flex;align-items:center;justify-content:center;color:var(--lime)}
.pick .grow{display:flex;flex-direction:column}
.toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 80px);max-width:448px;margin:0 auto;background:#F2F4F7;color:#0E1116;padding:12px 14px;border-radius:14px;font-size:14px;font-weight:500;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:5}
.toast.show{opacity:1;transform:none}
.toast.err{background:#FFD9DA}
</style>
</head>
<body>
<main id="view" aria-live="polite"></main>
<nav aria-label="Main">
  <button data-action="go" data-view="today"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Today</button>
  <button data-action="go" data-view="plan"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</button>
  <button data-action="go" data-view="zones"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>Zones</button>
  <button data-action="go" data-view="settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</nav>
<div id="toast" class="toast" role="status"></div>
<script>
/* Pace core: dates, zones, readiness, plan generation, adaptation and
   Intervals.icu workout text. Pure functions only (no DOM, no network). */

const Z_COLORS = ['#8FA3BF', '#4EA8FF', '#3FD08A', '#FF9F43', '#FF5A5F'];
const Z_NAMES = ['Recovery', 'Endurance', 'Tempo', 'Threshold', 'Max effort'];
const Z_USES = ['Warm-ups, cool-downs, recoveries', 'Most runs and rides live here',
  'Comfortably hard, used sparingly', 'Intervals, 3–8 min repeats', 'Short all-out efforts, rarely'];
const Z_PCT = [0.6, 0.7, 0.8, 0.9, 1.0]; // upper bound of each zone, % of max HR

const SESSION_TYPES = {
  rest: { label: 'Rest', sport: null },
  easyRun: { label: 'Easy run', sport: 'Run' },
  qualityRun: { label: 'Run workout', sport: 'Run' },
  longRun: { label: 'Long run', sport: 'Run' },
  easyRide: { label: 'Endurance ride', sport: 'Ride' },
  longRide: { label: 'Long ride', sport: 'Ride' },
  liftA: { label: 'Dumbbell strength A', sport: 'WeightTraining' },
  liftB: { label: 'Dumbbell strength B', sport: 'WeightTraining' },
};

const DAY_KEYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
const DAY_SHORT = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

const DEFAULT_SCHEDULE = {
  mon: 'liftA', tue: 'easyRun', wed: 'easyRide', thu: 'liftB',
  fri: 'rest', sat: 'qualityRun', sun: 'longRide',
};

const LIFTS = {
  liftA: {
    focus: 'Lower body + core',
    moves: [
      ['Goblet squat', '10', 'Goblet_Squat'],
      ['Dumbbell Romanian deadlift', '10', 'Stiff-Legged_Dumbbell_Deadlift'],
      ['Reverse lunge', '8 each leg', 'Dumbbell_Rear_Lunge'],
      ['Single-leg glute bridge', '12 each leg', 'Single_Leg_Glute_Bridge'],
      ['Dead bug', '10 each side', 'Dead_Bug'],
    ],
  },
  liftB: {
    focus: 'Upper body + core',
    moves: [
      ['Dumbbell floor press', '10', 'Dumbbell_Floor_Press'],
      ['One-arm dumbbell row', '10 each arm', 'One-Arm_Dumbbell_Row'],
      ['Standing overhead press', '8', 'Standing_Dumbbell_Press'],
      ['Dumbbell biceps curl', '12', 'Dumbbell_Bicep_Curl'],
      ['Side plank', '3 holds each side', 'Side_Bridge'],
    ],
  },
};

// Exercise photos come from free-exercise-db (public domain). Photos for the
// plan's own moves ship with the app; any other pick loads from the library.
const BUNDLED_EX = ['Goblet_Squat', 'Stiff-Legged_Dumbbell_Deadlift', 'Dumbbell_Rear_Lunge', 'Single_Leg_Glute_Bridge', 'Dead_Bug',
  'Dumbbell_Floor_Press', 'One-Arm_Dumbbell_Row', 'Standing_Dumbbell_Press', 'Dumbbell_Bicep_Curl', 'Side_Bridge'];
function exImage(id, frame) {
  if (!id || !/^[A-Za-z0-9_\-()',.]+$/.test(id)) return '';
  return BUNDLED_EX.includes(id) ? 'img/ex/' + id + '/' + frame + '.jpg'
    : 'https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/' + encodeURIComponent(id) + '/' + frame + '.jpg';
}

const SPORT_MATCH = {
  Run: ['Run', 'TrailRun', 'VirtualRun', 'Treadmill'],
  Ride: ['Ride', 'VirtualRide', 'GravelRide', 'MountainBikeRide', 'EBikeRide', 'EMountainBikeRide'],
  WeightTraining: ['WeightTraining', 'Workout', 'Crossfit', 'HighIntensityIntervalTraining'],
};

/* ---------- dates (local, YYYY-MM-DD strings) ---------- */
function pad(n) { return String(n).padStart(2, '0'); }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseYmd(s) { const [y, m, d] = s.slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function daysBetween(a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }
function mondayOf(s) { const d = parseYmd(s); const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow); return ymd(d); }
function dayIndex(s) { return (parseYmd(s).getDay() + 6) % 7; } // 0 = Monday

/* ---------- zones ---------- */
function estMaxHr(age) { return Math.round(220 - (Number(age) || 36)); }
function maxHrFor(settings) { return Number(settings.maxHr) > 0 ? Number(settings.maxHr) : estMaxHr(settings.age); }
function zoneTops(maxHr) { return Z_PCT.map(p => Math.round(maxHr * p)); }
function zoneRanges(maxHr) {
  const tops = zoneTops(maxHr);
  return tops.map((top, i) => ({ zone: i + 1, lo: i === 0 ? Math.round(maxHr * 0.5) : tops[i - 1], hi: top }));
}

/* ---------- formatting ---------- */
function fmtDur(sec) {
  const m = Math.floor(sec / 60), s = Math.round(sec % 60);
  if (m >= 60) { const h = Math.floor(m / 60), mm = m % 60; return h + 'h' + (mm ? ' ' + mm + 'm' : ''); }
  return s ? m + ':' + pad(s) : m + ' min';
}
function fmtClock(sec) { const m = Math.floor(sec / 60), s = Math.round(sec % 60); return m + ':' + pad(s); }
function icuDur(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = Math.round(sec % 60);
  return (h ? h + 'h' : '') + (m ? m + 'm' : '') + (s ? s + 's' : '') || '0s';
}
function zoneLabel(z) { if (!z) return ''; return z[0] === z[1] ? 'Zone ' + z[0] : 'Zone ' + z[0] + '–' + z[1]; }
function zoneBpm(z, maxHr) {
  if (!z) return '';
  const r = zoneRanges(maxHr);
  const lo = r[z[0] - 1].lo, hi = r[z[1] - 1].hi;
  return z[0] === 1 ? 'under ' + hi + ' bpm' : lo + '–' + hi + ' bpm';
}
function round5(min) { return Math.max(5, Math.round(min / 5) * 5); }

/* ---------- session model ----------
   session = { date, type, sport, name, summary, hard, blocks: [step | {repeat, label, steps}],
               notes: [], adjusted: bool, focus? }
   step = { label, sec, zone: [lo, hi] | null, kind } */
function totalSec(blocks) {
  return blocks.reduce((t, b) => t + (b.repeat ? b.repeat * b.steps.reduce((a, s) => a + s.sec, 0) : b.sec), 0);
}
function flatSteps(blocks) {
  const out = [];
  blocks.forEach(b => {
    if (b.repeat) { for (let i = 0; i < b.repeat; i++) b.steps.forEach(s => out.push(s)); }
    else out.push(b);
  });
  return out;
}
function zoneTime(blocks) {
  const t = [0, 0, 0, 0, 0];
  flatSteps(blocks).forEach(s => { if (s.zone) t[s.zone[1] - 1] += s.sec; });
  return t;
}
function summarize(s) {
  if (!s.sport) return 'Optional 10 min mobility';
  const lifts = s.blocks.filter(b => b.kind === 'lift');
  if (s.sport === 'WeightTraining') {
    const sets = lifts.length ? Math.max.apply(null, lifts.map(b => b.sets)) : 0;
    return (s.focus ? s.focus + ' · ' : '') + lifts.length + ' exercises · ' + sets + ' sets';
  }
  const steps = flatSteps(s.blocks).filter(x => x.zone);
  if (!steps.length) return fmtDur(totalSec(s.blocks));
  const top = Math.max.apply(null, steps.map(x => x.zone[1]));
  const hasRepeat = s.blocks.some(b => b.repeat);
  return fmtDur(totalSec(s.blocks)) + ' · ' + (top >= 3 ? 'Zone ' + top + (hasRepeat ? ' repeats' : ' work') : zoneLabel(steps[0].zone));
}
function liftLabel(b) { return b.move + ' ' + b.sets + '×' + b.reps; }
function intensitySplit(blocks) {
  let easy = 0, hard = 0;
  flatSteps(blocks).forEach(s => { if (!s.zone) return; if (s.zone[1] >= 3) hard += s.sec; else easy += s.sec; });
  return { easy, hard };
}

/* ---------- plan position ---------- */
function weekInfo(planStart, date) {
  const start = mondayOf(planStart || date);
  let w = Math.floor(daysBetween(start, date) / 7) + 1;
  if (w < 1) w = 1;
  const block = Math.floor((w - 1) / 12);
  const wib = ((w - 1) % 12) + 1;
  const deload = wib % 4 === 0;
  const phase = wib <= 4 ? 'Base building' : wib <= 8 ? 'Build' : 'Sharpen';
  return { week: w, block, wib, deload, phase, monday: addDays(start, (w - 1) * 7) };
}
function volumeFactor(wi) {
  const progressiveBefore = (wi.wib - 1) - Math.floor((wi.wib - 1) / 4);
  let f = Math.pow(1.08, progressiveBefore) * Math.pow(1.12, wi.block);
  if (wi.deload) f *= 0.7;
  return f;
}

/* ---------- builders ---------- */
function easyZone(settings) { return settings.easyCeiling === false ? [2, 2] : [1, 2]; }

function buildEndurance(type, date, wi, factor, settings) {
  const base = { easyRun: 25, longRun: 40, easyRide: 40, longRide: 55 }[type];
  const min = round5(base * factor);
  const sport = SESSION_TYPES[type].sport;
  const z = easyZone(settings);
  const notes = [];
  if (sport === 'Run' && wi.block === 0 && wi.wib <= 4) notes.push('Walk breaks are fine. Staying under the Zone 2 ceiling is the goal.');
  return {
    date, type, sport, hard: false,
    name: SESSION_TYPES[type].label,
    summary: min + ' min · ' + zoneLabel(z),
    blocks: [{ label: sport === 'Ride' ? 'Steady' : 'Easy', sec: min * 60, zone: z, kind: 'easy' }],
    notes,
  };
}

function buildQualityRun(date, wi, settings) {
  const z = easyZone(settings);
  const warm = { label: 'Warm up', sec: 600, zone: [2, 2], kind: 'warm' };
  const cool = { label: 'Cool down', sec: 480, zone: [1, 1], kind: 'cool' };
  let reps, work, rec, name;
  if (wi.deload || wi.wib <= 3) {
    reps = wi.deload ? 4 : [3, 4, 5][wi.wib - 1];
    work = { label: 'Pick up', sec: 60, zone: [3, 3], kind: 'work' };
    rec = { label: 'Easy', sec: 120, zone: z, kind: 'rec' };
    name = 'Run · ' + reps + ' × 1 min pickups';
  } else if (wi.wib <= 7) {
    reps = [3, 4, 5][wi.wib - 5];
    work = { label: 'Work', sec: 180, zone: [4, 4], kind: 'work' };
    rec = { label: 'Recover', sec: 120, zone: [1, 1], kind: 'rec' };
    name = 'Run · ' + reps + ' × 3 min';
  } else {
    reps = [3, 3, 4][wi.wib - 9];
    work = { label: 'Work', sec: 300, zone: [4, 4], kind: 'work' };
    rec = { label: 'Recover', sec: 180, zone: [1, 1], kind: 'rec' };
    name = 'Run · ' + reps + ' × 5 min';
  }
  reps = Math.min(6, reps + wi.block);
  const s = {
    date, type: 'qualityRun', sport: 'Run', hard: true, name: name.replace(/\d+ ×/, reps + ' ×'),
    blocks: [warm, { repeat: reps, label: 'Intervals', steps: [work, rec] }, cool], notes: [],
  };
  s.summary = fmtDur(totalSec(s.blocks)) + ' · ' + zoneLabel(work.zone) + ' repeats';
  return s;
}

function buildLift(type, date, wi) {
  const sets = wi.deload ? 2 : (wi.block === 0 && wi.wib <= 2 ? 2 : 3);
  const lift = LIFTS[type];
  const blocks = [{ label: 'Warm up: easy movement', sec: 300, zone: null, kind: 'warm' }];
  lift.moves.forEach(([move, reps, ex]) => blocks.push({ label: move + ' ' + sets + '×' + reps, sec: sets * 120, zone: null, kind: 'lift', move, sets, reps, ex }));
  return {
    date, type, sport: 'WeightTraining', hard: false,
    name: SESSION_TYPES[type].label, focus: lift.focus,
    summary: lift.focus + ' · ' + sets + ' sets',
    blocks,
    notes: ['When you hit every rep on every set, go up 5 lb next time.'],
  };
}

function buildSession(type, date, settings, opts) {
  opts = opts || {};
  const wi = weekInfo(settings.planStart, date);
  let factor = volumeFactor(wi);
  if (opts.holdProgression && !wi.deload && wi.wib > 1) factor = volumeFactor(Object.assign({}, wi, { wib: wi.wib - 1, deload: (wi.wib - 1) % 4 === 0 }));
  let s;
  if (!type || type === 'rest') s = { date, type: 'rest', sport: null, hard: false, name: 'Rest', summary: 'Optional 10 min mobility', blocks: [], notes: [] };
  else if (type === 'qualityRun') s = buildQualityRun(date, wi, settings);
  else if (type === 'liftA' || type === 'liftB') s = buildLift(type, date, wi);
  else s = buildEndurance(type, date, wi, factor, settings);
  s.week = wi;
  s.adjusted = false;
  return s;
}

/* ---------- readiness ---------- */
function mean(a) { return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null; }
function sd(a) { const m = mean(a); return a.length > 1 ? Math.sqrt(a.reduce((t, x) => t + (x - m) * (x - m), 0) / (a.length - 1)) : null; }

function readiness(wellness, today) {
  const rows = (wellness || []).filter(r => r && r.id && r.id <= today).sort((a, b) => a.id < b.id ? -1 : 1);
  if (!rows.length) return null;
  const last = rows[rows.length - 1];
  if (daysBetween(last.id, today) > 1) return null;
  const prior = rows.filter(r => r.id < last.id);
  const vals = (key, days) => prior.filter(r => daysBetween(r.id, last.id) <= days && r[key] != null && r[key] > 0).map(r => r[key]);

  let score = 70; const reasons = []; const metrics = {};
  if (last.hrv) {
    const b7 = mean(vals('hrv', 7)), b28 = vals('hrv', 28), m28 = mean(b28);
    // Day-to-day HRV normally swings ~8%; floor the spread so a very steady
    // baseline doesn't turn a small dip into a big score drop.
    const s28 = m28 ? Math.max(sd(b28) || 0, m28 * 0.08) : null;
    metrics.hrv = { value: Math.round(last.hrv), vs7: b7 ? (last.hrv - b7) / b7 : null };
    if (m28 && s28 && b28.length >= 5) {
      const z = (last.hrv - m28) / s28;
      score += Math.max(-25, Math.min(15, z * 10));
      if (metrics.hrv.vs7 != null && Math.abs(metrics.hrv.vs7) >= 0.05) reasons.push('HRV ' + Math.round(Math.abs(metrics.hrv.vs7) * 100) + '% ' + (metrics.hrv.vs7 < 0 ? 'below' : 'above') + ' your 7-day average');
    }
  }
  if (last.restingHR) {
    const b7 = mean(vals('restingHR', 7));
    metrics.rhr = { value: Math.round(last.restingHR), delta: b7 ? last.restingHR - b7 : null };
    if (b7) {
      const d = last.restingHR - b7;
      score -= Math.max(-6, Math.min(20, d * 3));
      if (d >= 3) reasons.push('Resting HR ' + Math.round(d) + ' bpm above normal');
    }
  }
  if (last.sleepSecs) {
    const h = last.sleepSecs / 3600;
    metrics.sleep = { value: h };
    if (h < 6) { score -= 15; reasons.push('Short sleep (' + h.toFixed(1) + ' h)'); }
    else if (h < 7) score -= 5;
    else if (h >= 8) score += 5;
  }
  if (last.ctl != null && last.atl != null) {
    const form = last.ctl - last.atl;
    metrics.form = { value: Math.round(form), ctl: Math.round(last.ctl), atl: Math.round(last.atl) };
    if (form < -25) { score -= 10; reasons.push('Fatigue is high relative to fitness'); }
    else if (form < -15) score -= 5;
    else if (form > 5) score += 5;
  }
  if (!metrics.hrv && !metrics.rhr && !metrics.sleep) return null;
  score = Math.round(Math.max(5, Math.min(100, score)));
  const band = score >= 65 ? 'go' : score >= 55 ? 'trim' : score >= 40 ? 'easy' : 'rest';
  const headline = { go: 'Ready, go as planned', trim: 'A little off, hard work trimmed', easy: 'Take it easy today', rest: 'Rest and recover today' }[band];
  return { score, band, headline, reasons, metrics, date: last.id };
}

/* ---------- adaptation ---------- */
function clone(o) { return JSON.parse(JSON.stringify(o)); }

function adapt(session, r, settings) {
  if (!r || session.type === 'rest' || r.band === 'go') return session;
  const s = clone(session);
  const why = r.reasons.length ? r.reasons[0] : 'Readiness ' + r.score;
  const z = easyZone(settings);
  if (r.band === 'rest') {
    if (s.sport === 'WeightTraining') {
      return Object.assign(s, { type: 'rest', sport: null, name: 'Rest (was ' + session.name + ')', summary: 'Optional 10 min mobility', blocks: [], hard: false, adjusted: true,
        notes: [why + ', so strength moves to another day.'] });
    }
    return Object.assign(s, { name: 'Recovery ' + (s.sport === 'Ride' ? 'spin' : 'walk or jog'), summary: '20 min · Zone 1', hard: false, adjusted: true,
      blocks: [{ label: 'Recovery', sec: 1200, zone: [1, 1], kind: 'easy' }],
      notes: [why + ', so today is an optional 20 min in Zone 1.'] });
  }
  if (s.sport === 'WeightTraining') {
    if (r.band === 'easy') {
      s.blocks.forEach(b => { if (b.kind === 'lift' && b.sets > 2) { b.sets -= 1; b.sec = b.sets * 120; b.label = b.move + ' ' + b.sets + '×' + b.reps; } });
      s.summary = s.focus + ' · 2 sets';
      s.adjusted = true;
      s.notes.unshift(why + ', so one set comes off each exercise.');
    }
    return s;
  }
  if (s.hard) {
    const rep = s.blocks.find(b => b.repeat);
    if (r.band === 'trim' && rep) {
      const before = rep.repeat;
      rep.repeat = Math.max(2, rep.repeat - 1);
      rep.steps[1].sec += 60;
      s.name = s.name.replace(/\d+ ×/, rep.repeat + ' ×');
      s.summary = fmtDur(totalSec(s.blocks)) + ' · ' + zoneLabel(rep.steps[0].zone) + ' repeats';
      s.adjusted = true;
      s.notes.unshift(why + ', so we cut ' + before + ' repeats to ' + rep.repeat + ' and added a minute to each recovery.');
      return s;
    }
    const min = round5((totalSec(s.blocks) / 60) * 0.8);
    return Object.assign(s, { name: 'Easy run (swapped)', summary: min + ' min · ' + zoneLabel(z), hard: false, adjusted: true,
      blocks: [{ label: 'Easy', sec: min * 60, zone: z, kind: 'easy' }],
      notes: [why + ', so the intervals became an easy Zone 2 run.'] });
  }
  if (r.band === 'easy') {
    const b = s.blocks[0];
    const min = round5((b.sec / 60) * 0.8);
    b.sec = min * 60;
    s.summary = min + ' min · ' + zoneLabel(b.zone);
    s.adjusted = true;
    s.notes.unshift(why + ', so this is 20% shorter.');
  }
  return s;
}

/* ---------- completion ---------- */
function activitiesByDate(acts) {
  const m = {};
  (acts || []).forEach(a => { const d = (a.start_date_local || '').slice(0, 10); if (!d) return; (m[d] = m[d] || []).push(a.type); });
  return m;
}
function isDone(session, actMap) {
  if (!session.sport) return false;
  const types = actMap[session.date] || [];
  return types.some(t => (SPORT_MATCH[session.sport] || []).includes(t));
}
function weekCompletion(settings, monday, actMap, upTo) {
  let planned = 0, done = 0;
  for (let i = 0; i < 7; i++) {
    const d = addDays(monday, i);
    if (d >= upTo) break;
    const type = (settings.schedule || DEFAULT_SCHEDULE)[DAY_KEYS[i]];
    if (!type || type === 'rest') continue;
    planned++;
    if (isDone({ date: d, sport: SESSION_TYPES[type].sport }, actMap)) done++;
  }
  return { planned, done, rate: planned ? done / planned : 1 };
}

/* ---------- the plan ---------- */
function planDays(settings, from, n, ctx) {
  ctx = ctx || {};
  const today = ctx.today || from;
  const actMap = activitiesByDate(ctx.activities);
  const sched = settings.schedule || DEFAULT_SCHEDULE;
  const out = [];
  for (let i = 0; i < n; i++) {
    const date = addDays(from, i);
    const wi = weekInfo(settings.planStart, date);
    let hold = false;
    if (ctx.activities && wi.week > 1) {
      const prev = weekCompletion(settings, addDays(wi.monday, -7), actMap, wi.monday);
      hold = prev.planned > 0 && prev.rate < 0.6;
    }
    const ov = ctx.overrides && ctx.overrides[date];
    let s;
    if (ov) {
      s = Object.assign(clone(ov), { date, week: wi, held: false, adjusted: false, edited: true });
      s.hard = flatSteps(s.blocks).some(x => x.zone && x.zone[1] >= 4);
      s.summary = summarize(s);
      s.notes = (s.notes || []).filter(n => n.indexOf('You edited') !== 0);
      s.notes.unshift('You edited this workout, so readiness changes leave it alone.');
    } else {
      s = buildSession(sched[DAY_KEYS[dayIndex(date)]], date, settings, { holdProgression: hold });
      s.held = hold;
      if (date === today) s = adapt(s, ctx.readiness, settings);
    }
    s.done = isDone(s, actMap);
    s.status = s.type === 'rest' ? 'rest' : s.done ? 'done' : date < today ? 'missed' : date === today ? 'today' : 'upcoming';
    out.push(s);
  }
  return out;
}

function planNotes(days, ctx) {
  const notes = [];
  days.forEach(d => { if (d.adjusted && d.notes[0]) notes.push({ tone: 'warn', text: DAY_SHORT[dayIndex(d.date)] + ': ' + d.notes[0] }); });
  const first = days[0];
  if (first && first.week.deload) notes.push({ tone: 'info', text: 'Recovery week: volume drops about 30% so the last three weeks sink in.' });
  else if (first && first.week.wib % 4 === 3) notes.push({ tone: 'info', text: 'Next week is a recovery week with about 30% less volume.' });
  if (days.some(d => d.held)) notes.push({ tone: 'warn', text: 'Last week was short on sessions, so volume holds instead of growing.' });
  else if (first && !first.week.deload && first.week.wib > 1) notes.push({ tone: 'good', text: 'Endurance time grows about 8% this week, under the 10% cap.' });
  const missed = days.filter(d => d.status === 'missed');
  if (missed.length) notes.push({ tone: 'info', text: missed.length + ' missed session' + (missed.length > 1 ? 's' : '') + ' this week. They are not stacked onto other days.' });
  return notes;
}

/* ---------- Intervals.icu ---------- */
/* Step labels are free text, but Intervals.icu reads durations (10m, 30s),
   targets (70%, Z2, 220w) and repeat headers (4x) out of a line. Rewrite
   those tokens in words so a typed label can't change the workout. */
const UNIT_WORDS = { s: 'sec', sec: 'sec', secs: 'sec', m: 'min', min: 'min', mins: 'min', h: 'hr', hr: 'hr', hrs: 'hr', km: 'kilometers', mi: 'miles', mtr: 'meters', w: 'watts', rpm: 'cadence' };
function safeLabel(text) {
  return String(text || '').replace(/[\r\n]+/g, ' ')
    .replace(/(\d+(?:\.\d+)?)\s*(secs|sec|s|mins|min|m|hrs|hr|h|km|mi|mtr|w|rpm)\b/gi, (_, n, u) => n + ' ' + UNIT_WORDS[u.toLowerCase()])
    .replace(/(\d+)\s*%/g, '$1 percent')
    .replace(/\b[zZ](\d)\b/g, 'zone $1')
    .replace(/\b(\d+)\s*[xX]\b/g, '$1 times')
    .replace(/^[\s-]+/, '')
    .replace(/\s{2,}/g, ' ')
    .trim();
}
function icuStep(s) {
  const target = s.zone ? (s.zone[0] === s.zone[1] ? 'Z' + s.zone[0] + ' HR' : 'Z' + s.zone[0] + '-Z' + s.zone[1] + ' HR') : '';
  const label = s.kind === 'lift' ? safeLabel(s.move) + ' ' + s.sets + '×' + safeLabel(s.reps) : safeLabel(s.label);
  return ('- ' + label + ' ' + icuDur(s.sec) + ' ' + target).replace(/\s{2,}/g, ' ').trim();
}
function icuText(session) {
  const parts = [];
  if (session.blocks.some(b => b.kind === 'lift')) parts.push((session.focus ? safeLabel(session.focus) + '. ' : '') + 'Each step is all sets of one exercise, rest included.\n');
  session.blocks.forEach(b => {
    if (b.repeat) parts.push('\n' + (safeLabel(b.label) || 'Repeat') + ' ' + b.repeat + 'x\n' + b.steps.map(icuStep).join('\n') + '\n');

    h += '<section class="card"><div class="row-between small"><b>Easy vs hard</b><span class="muted">target 80 / 20</span></div>' +
      '<div class="split" role="img" aria-label="' + ep + ' percent easy"><div style="flex:' + easy + ';background:var(--z2)"></div><div style="flex:' + hard + ';background:var(--z4)"></div></div>' +
      '<div class="row-between tiny"><span>' + ep + '% easy · ' + C.fmtDur(tot) + ' run + ride</span><span>' + (100 - ep) + '% hard</span></div></section>';
    h += '<div class="list">' + days.map(d => {
      const isT = d.date === t;
      const right = d.status === 'done' ? '<span class="ok" role="img" aria-label="Done">' + ICON.check + '</span>' :
        d.status === 'missed' ? '<span class="pill red">Missed</span>' : d.edited ? '<span class="pill blue">Edited</span>' : d.adjusted ? '<span class="pill amber">Adjusted</span>' : '';
      return '<button class="li' + (isT ? ' on' : '') + '" data-action="open" data-date="' + d.date + '"><span class="li-day">' + C.DAY_SHORT[C.dayIndex(d.date)].toUpperCase() + '</span><span class="li-main"><span class="li-name">' + esc(d.name) + '</span><span class="muted small">' + esc(d.summary) + '</span></span>' + right + '</button>';
    }).join('') + '</div>';
    if (notes.length) {
      h += '<section class="card"><span class="eyebrow">WHY THE PLAN LOOKS LIKE THIS</span>' + notes.map(n => '<div class="bullet ' + n.tone + '"><span>•</span><span>' + esc(n.text) + '</span></div>').join('') + '</section>';
    }
    return h;
  }

  function stepRow(st, max, start) {
    const col = st.zone ? C.Z_COLORS[st.zone[1] - 1] : 'var(--muted)';
    const sub = st.zone ? C.zoneLabel(st.zone) + ' · ' + C.zoneBpm(st.zone, max) : (st.kind === 'lift' ? st.sets + ' sets of ' + st.reps + ' · about ' + C.fmtDur(st.sec) + ' with rest' : 'No heart rate target');
    const title = st.kind === 'lift' ? st.move : st.label + ' · ' + C.fmtClock(st.sec);
    const when = start == null ? '' : '<span class="when">' + C.fmtClock(start) + '–' + C.fmtClock(start + st.sec) + '</span>';
    return '<div class="step"><span class="bar" style="background:' + col + '"></span><div class="grow"><div class="step-name">' + esc(title) + '</div><div class="muted small">' + esc(sub) + '</div></div>' + when + '</div>';
  }

  function zoneTable(s) {
    const zt = C.zoneTime(s.blocks), tot = zt.reduce((a, b) => a + b, 0);
    if (!tot) return '';
    return '<section class="card"><span class="eyebrow">TIME IN EACH ZONE</span>' + zt.map((sec, i) => !sec ? '' :
      '<div class="zt"><span class="zdot" style="background:' + C.Z_COLORS[i] + '"></span><span class="grow">Zone ' + (i + 1) + ' · ' + C.Z_NAMES[i] + '</span><span class="zt-bar"><span style="width:' + Math.round(sec / tot * 100) + '%;background:' + C.Z_COLORS[i] + '"></span></span><span class="zt-t">' + C.fmtDur(sec) + '</span></div>').join('') + '</section>';
  }

  function viewDetail() {
    const s = sessionFor(UI.detail);
    const max = C.maxHrFor(S);
    const canEdit = s.date >= today();
    let h = '<header class="top"><button class="icon-btn" data-action="back" aria-label="Back">' + ICON.back + '</button><div class="grow"><h1 class="h-sm">' + esc(s.name) + '</h1><div class="sub">' + esc(fmtDate(s.date) + ' · ' + (s.blocks.length ? C.fmtDur(C.totalSec(s.blocks)) : 'rest day')) + '</div></div>' +
      (canEdit ? '<button class="icon-btn" data-action="edit" aria-label="Edit workout">' + ICON.edit + '</button>' : '') + '</header>';
    if (s.type === 'rest') {
      h += '<section class="card note-card">' + ICON.rest + '<span>' + esc(s.notes[0] || 'Rest day. An easy walk or 10 minutes of mobility is plenty.') + '</span></section>';
      if (canEdit) h += '<button class="btn" data-action="edit">Add a workout this day</button>';
      if (s.edited) h += '<button class="btn ghost" data-action="reset">Reset to the plan</button>';
      return h;
    }
    if (s.notes.length) h += s.notes.map((n, i) => '<div class="why ' + (i === 0 && (s.adjusted || s.edited) ? '' : 'calm') + '">' + ICON.info + '<span>' + esc(n) + '</span></div>').join('');
    if (s.sport !== 'WeightTraining') h += '<section class="card">' + shapeBar(s, 64) + '<div class="row-between tiny"><span>0:00</span><span>' + C.fmtClock(C.totalSec(s.blocks)) + '</span></div></section>';
    h += '<span class="eyebrow">STEPS</span><div class="list">';
    let t = 0;
    s.blocks.forEach(b => {
      if (b.repeat) {
        const round = b.steps.reduce((a, x) => a + x.sec, 0);
        h += '<div class="card repeat"><div class="row-between"><span class="rep">REPEAT ' + b.repeat + '×</span><span class="when">' + C.fmtClock(t) + '–' + C.fmtClock(t + round * b.repeat) + '</span></div>' +
          b.steps.map(x => stepRow(x, max, null)).join('') +
          '<div class="tiny">Each round ' + C.fmtClock(round) + ' · ' + C.fmtDur(round * b.repeat) + ' in total</div></div>';
        t += round * b.repeat;
      } else if (b.kind === 'lift') {
        h += liftCard(b);
        t += b.sec;
      } else {
        h += '<div class="card">' + stepRow(b, max, t) + '</div>';
        t += b.sec;
      }
    });
    h += '</div>';
    if (s.sport === 'WeightTraining') loadLib();
    if (s.sport !== 'WeightTraining') h += zoneTable(s);
    if (canEdit) h += '<button class="btn" data-action="edit">' + ICON.edit + ' Edit this workout</button>';
    if (s.edited) h += '<button class="btn ghost" data-action="reset">Reset to the plan</button>';
    if (s.sport !== 'WeightTraining') {
      h += '<span class="eyebrow">ON YOUR WATCH</span><section class="card flat">' +
        '<div class="kv"><b>Step changes</b><span class="muted small">The fenix beeps, buzzes and shows the next step and its target.</span></div>' +
        '<div class="kv"><b>Out-of-zone alerts</b><span class="muted small">Alerts when your heart rate leaves the step\'s range, until you\'re back in it.</span></div>' +
        '<label class="toggle"><span><b>Easy-day ceiling</b><span class="muted small">Easy steps target Zone 1–2, so you only hear about it when you go too hard.</span></span><input type="checkbox" data-setting="easyCeiling"' + (S.easyCeiling !== false ? ' checked' : '') + '></label>' +
        '<div class="tiny">Beep vs vibrate is set on the watch in the run and bike activity settings.</div></section>';
    } else {
      h += '<section class="card note-card">' + ICON.watch + '<span>On the fenix this shows up as a strength workout with one timed step per exercise. Keep this screen handy for the moves and reps.</span></section>';
    }
    h += '<details class="card flat"><summary>Workout text sent to Intervals.icu</summary><pre>' + esc(C.icuText(s)) + '</pre></details>';
    h += '<button class="btn primary" data-action="send"' + (UI.sending ? ' disabled' : '') + '>' + (UI.sending ? 'Sending…' : 'Send next 7 days to watch') + '</button><div class="tiny center">' + esc(sentLine(s.date)) + '</div>';
    return h;
  }

  /* ---------------- editor ---------------- */
  function draftFrom(s) {
    return C.clone({ type: s.type, sport: s.sport, name: s.name, focus: s.focus || '', blocks: s.blocks || [] });
  }
  function startEdit(date) {
    let s = sessionFor(date);
    if (s.type === 'rest') s = C.buildSession('easyRun', date, settings());
    UI.edit = { date, draft: draftFrom(s) };
    UI.detail = null;
  }
  // path "3" -> blocks[3]; "3.1" -> blocks[3].steps[1]
  function locate(path) {
    const d = UI.edit.draft, p = String(path).split('.').map(Number);
    if (p.length === 1) return { arr: d.blocks, i: p[0], item: d.blocks[p[0]] };
    const parent = d.blocks[p[0]];
    return { arr: parent.steps, i: p[1], item: parent.steps[p[1]], parent };
  }
  const clampSec = x => Math.max(10, Math.min(4 * 3600, Math.round(x)));

  function durInputs(st, path) {
    const m = Math.floor(st.sec / 60), s = st.sec % 60;
    const secOpts = [0, 15, 30, 45].concat([0, 15, 30, 45].includes(s) ? [] : [s]).sort((a, b) => a - b);
    return '<span class="dur"><input type="number" inputmode="numeric" min="0" max="240" value="' + m + '" data-ef="min" data-p="' + path + '" aria-label="Minutes"><span class="tiny">min</span>' +
      '<select data-ef="sec" data-p="' + path + '" aria-label="Seconds">' + secOpts.map(v => '<option value="' + v + '"' + (v === s ? ' selected' : '') + '>' + String(v).padStart(2, '0') + '</option>').join('') + '</select><span class="tiny">sec</span></span>';
  }
  function zoneSelect(st, path) {
    const cur = st.zone ? st.zone.join('-') : '';
    return '<select data-ef="zone" data-p="' + path + '" aria-label="Heart rate zone">' +
      '<option value=""' + (cur ? '' : ' selected') + '>No target</option>' +
      ZONE_OPTIONS.map(z => {
        const v = z.join('-'), r = C.zoneRanges(C.maxHrFor(S));
        const bpm = z[0] === 1 ? '<' + r[z[1] - 1].hi : r[z[0] - 1].lo + '–' + r[z[1] - 1].hi;
        return '<option value="' + v + '"' + (v === cur ? ' selected' : '') + '>Z' + (z[0] === z[1] ? z[0] : z[0] + '–' + z[1]) + ' · ' + bpm + '</option>';
      }).join('') + '</select>';
  }
  function moveBtns(path, i, n) {
    return '<span class="ed-btns">' +
      '<button class="mini" data-action="ed-up" data-p="' + path + '" aria-label="Move up"' + (i === 0 ? ' disabled' : '') + '>' + ICON.up + '</button>' +
      '<button class="mini" data-action="ed-down" data-p="' + path + '" aria-label="Move down"' + (i === n - 1 ? ' disabled' : '') + '>' + ICON.down + '</button>' +
      '<button class="mini danger" data-action="ed-del" data-p="' + path + '" aria-label="Delete">' + ICON.trash + '</button></span>';
  }
  function edStep(st, path, i, n) {
    const col = st.zone ? C.Z_COLORS[st.zone[1] - 1] : 'var(--line)';
    return '<div class="ed-step" style="border-left-color:' + col + '">' +
      '<div class="ed-row"><input type="text" value="' + esc(st.label) + '" data-ef="label" data-p="' + path + '" aria-label="Step name" maxlength="40">' + moveBtns(path, i, n) + '</div>' +
      '<div class="ed-row wrap">' + durInputs(st, path) + zoneSelect(st, path) + '</div></div>';
  }
  function edLift(b, path, i, n) {
    const setOpts = [1, 2, 3, 4, 5, 6].map(v => '<option value="' + v + '"' + (v === b.sets ? ' selected' : '') + '>' + v + ' sets</option>').join('');
    const thumb = b.ex ? '<img class="ed-thumb" src="' + esc(C.exImage(b.ex, 0)) + '" alt="" loading="lazy" onerror="this.remove()">' : '';
    return '<div class="ed-step" style="border-left-color:var(--muted)">' +
      '<div class="ed-row">' + thumb + '<input type="text" value="' + esc(b.move) + '" data-ef="move" data-p="' + path + '" aria-label="Exercise" maxlength="40">' + moveBtns(path, i, n) + '</div>' +
      '<button class="link pick-link" data-action="ed-pick" data-p="' + path + '">' + (b.ex ? 'Swap exercise' : 'Choose from library to add pictures') + '</button>' +
      '<div class="ed-row wrap"><select data-ef="sets" data-p="' + path + '" aria-label="Sets">' + setOpts + '</select>' +
      '<label class="reps"><span class="tiny">reps</span><input type="text" value="' + esc(b.reps) + '" data-ef="reps" data-p="' + path + '" aria-label="Reps" maxlength="24"></label></div></div>';
  }

  function pickResults() {
    const P = UI.edit.picker;
    if (!LIB) { loadLib(); return '<div class="tiny center">Loading exercises…</div>'; }
    const q = P.q.trim().toLowerCase(), eqs = EQ_GROUPS[P.eq].eq;
    const words = q.split(/\s+/).filter(Boolean);
    const hits = LIB.filter(e => (!eqs || eqs.includes(e.eq)) &&
      words.every(w => (e.name + ' ' + e.mus.join(' ')).toLowerCase().includes(w)));
    let h = '';
    if (q) h += '<button class="pick custom" data-action="ed-pick-custom"><span class="pick-ph">' + ICON.plus + '</span><span class="grow"><span class="step-name">Use “' + esc(P.q.trim()) + '”</span><span class="muted small">Custom exercise, no pictures</span></span></button>';
    h += hits.slice(0, 40).map(e => '<button class="pick" data-action="ed-pick-choose" data-id="' + esc(e.id) + '"><img src="' + esc(C.exImage(e.id, 0)) + '" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'"><span class="grow"><span class="step-name">' + esc(e.name) + '</span><span class="muted small">' + esc(cap(e.eq === 'none' ? 'bodyweight' : e.eq) + (e.mus.length ? ' · ' + e.mus.join(', ') : '')) + '</span></span></button>').join('');
    if (!hits.length) h += '<div class="tiny center">No matches. Try another word, or "All".</div>';
    else if (hits.length > 40) h += '<div class="tiny center">Showing 40 of ' + hits.length + '. Type more to narrow it down.</div>';
    return h;
  }
  function viewPicker() {
    const P = UI.edit.picker;
    return '<header class="top"><button class="icon-btn" data-action="ed-pick-close" aria-label="Back to the workout">' + ICON.back + '</button><div class="grow"><h1 class="h-sm">' + (P.path == null ? 'Add exercise' : 'Swap exercise') + '</h1><div class="sub">Free Exercise DB · public domain photos</div></div></header>' +
      '<input class="search" type="search" placeholder="Search: squat, row, glutes…" value="' + esc(P.q) + '" data-pick-q="1" aria-label="Search exercises" autocomplete="off">' +
      '<div class="chips" role="group" aria-label="Equipment">' + Object.keys(EQ_GROUPS).map(k => '<button aria-pressed="' + (P.eq === k) + '" data-action="ed-pick-eq" data-eq="' + k + '">' + EQ_GROUPS[k].label + '</button>').join('') + '</div>' +
      '<div class="list" id="pick-results">' + pickResults() + '</div>';
  }

  function viewEdit() {
    const E = UI.edit, d = E.draft;
    if (E.picker) return viewPicker();
    const typeOpts = '<option value="">Keep current</option>' + Object.keys(C.SESSION_TYPES).map(k => '<option value="' + k + '">' + C.SESSION_TYPES[k].label + '</option>').join('');
    let h = '<header class="top"><button class="icon-btn" data-action="ed-cancel" aria-label="Cancel editing">' + ICON.back + '</button><div class="grow"><h1 class="h-sm">Edit workout</h1><div class="sub">' + esc(fmtDate(E.date, true)) + '</div></div></header>';
    h += '<section class="card"><label class="field"><span>Name</span><input type="text" value="' + esc(d.name) + '" data-ed="name" maxlength="60"></label>' +
      '<label class="field"><span>Start over from a plan workout</span><select data-ed="type">' + typeOpts + '</select></label></section>';

    if (!d.sport) {
      h += '<section class="card note-card">' + ICON.rest + '<span>This day is set to rest. Saving keeps it a rest day; pick a workout above to add one.</span></section>';
    } else if (d.sport === 'WeightTraining') {
      const warm = d.blocks.findIndex(b => b.kind !== 'lift');
      const lifts = d.blocks.map((b, i) => ({ b, i })).filter(x => x.b.kind === 'lift');
      if (warm >= 0) h += '<section class="card"><div class="ed-row"><b class="grow">Warm-up</b>' + durInputs(d.blocks[warm], warm) + '</div></section>';
      h += '<span class="eyebrow">EXERCISES</span><div class="list">' + lifts.map((x, k) => edLift(x.b, x.i, k, lifts.length)).join('') + '</div>' +
        '<button class="btn" data-action="ed-add-lift">' + ICON.plus + ' Add exercise</button>' +
        '<div class="tiny">Each exercise gets about 2 minutes per set, rest included, on the watch timer.</div>';
    } else {
      h += '<section class="card">' + shapeBar(d, 40) + '<div class="row-between tiny"><span>Total ' + C.fmtDur(C.totalSec(d.blocks)) + '</span><span>' + d.blocks.length + ' blocks</span></div></section>';
      h += '<span class="eyebrow">STEPS</span><div class="list">';
      d.blocks.forEach((b, i) => {
        if (b.repeat) {
          h += '<div class="card repeat ed-rep"><div class="ed-row"><input type="text" value="' + esc(b.label) + '" data-ef="replabel" data-p="' + i + '" aria-label="Repeat name" maxlength="30">' + moveBtns(i, i, d.blocks.length) + '</div>' +
            '<div class="ed-row"><span class="rep grow">REPEAT</span><button class="mini" data-action="ed-rep" data-d="-1" data-p="' + i + '" aria-label="One fewer round"' + (b.repeat <= 1 ? ' disabled' : '') + '>' + ICON.minus + '</button><b class="count">' + b.repeat + '×</b><button class="mini" data-action="ed-rep" data-d="1" data-p="' + i + '" aria-label="One more round"' + (b.repeat >= 30 ? ' disabled' : '') + '>' + ICON.plus + '</button></div>' +
            b.steps.map((st, j) => edStep(st, i + '.' + j, j, b.steps.length)).join('') +
            '<button class="btn small-btn" data-action="ed-add-step" data-p="' + i + '">' + ICON.plus + ' Step in this repeat</button></div>';
        } else {
          h += '<div class="card">' + edStep(b, String(i), i, d.blocks.length) + '</div>';
        }
      });
      h += '</div><div class="grid2"><button class="btn" data-action="ed-add-step">' + ICON.plus + ' Step</button><button class="btn" data-action="ed-add-rep">' + ICON.plus + ' Repeat block</button></div>';
    }
    h += '<button class="btn primary" data-action="ed-save">' + (isDemo() ? 'Save' : 'Save and send to watch') + '</button>' +
      '<button class="btn ghost" data-action="ed-cancel">Cancel</button>';
    return h;
  }

  function editAction(a, el) {
    const d = UI.edit.draft, p = el.dataset.p;
    if (a === 'ed-up' || a === 'ed-down') {
      const L = locate(p), j = L.i + (a === 'ed-up' ? -1 : 1);
      if (j < 0 || j >= L.arr.length) return;
      const tmp = L.arr[j]; L.arr[j] = L.arr[L.i]; L.arr[L.i] = tmp;
    } else if (a === 'ed-del') {
      const L = locate(p);
      L.arr.splice(L.i, 1);
      if (L.parent && !L.parent.steps.length) d.blocks.splice(Number(p.split('.')[0]), 1);
    } else if (a === 'ed-rep') {
      const b = d.blocks[Number(p)];
      b.repeat = Math.max(1, Math.min(30, b.repeat + Number(el.dataset.d)));
    } else if (a === 'ed-add-step') {
      const z = d.sport === 'Ride' || d.sport === 'Run' ? (S.easyCeiling !== false ? [1, 2] : [2, 2]) : null;
      const st = { label: 'Easy', sec: 300, zone: z, kind: 'easy' };
      if (p != null) d.blocks[Number(p)].steps.push(st); else d.blocks.push(st);
    } else if (a === 'ed-add-rep') {
      d.blocks.push({ repeat: 3, label: 'Intervals', steps: [
        { label: 'Work', sec: 180, zone: [4, 4], kind: 'work' },
        { label: 'Recover', sec: 120, zone: [1, 1], kind: 'rec' }] });
    } else if (a === 'ed-add-lift' || a === 'ed-pick') {
      UI.edit.picker = { path: a === 'ed-pick' ? p : null, q: '', eq: 'dumbbell' };
      loadLib(); render(); window.scrollTo(0, 0); return;
    } else if (a === 'ed-pick-close') {
      UI.edit.picker = null;
    } else if (a === 'ed-pick-eq') {
      UI.edit.picker.eq = el.dataset.eq;
    } else if (a === 'ed-pick-choose' || a === 'ed-pick-custom') {
      const P = UI.edit.picker;
      const e = a === 'ed-pick-choose' ? LIBMAP[el.dataset.id] : null;
      const move = e ? e.name : P.q.trim().slice(0, 40);
      if (!move) return;
      if (P.path == null) {
        const b = { label: '', sec: 360, zone: null, kind: 'lift', move, sets: 3, reps: '10', ex: e ? e.id : null };
        b.label = C.liftLabel(b); d.blocks.push(b);
      } else {
        const L = locate(P.path);
        L.item.move = move; L.item.ex = e ? e.id : null; L.item.label = C.liftLabel(L.item);
      }
      UI.edit.picker = null;
    } else if (a === 'ed-save') { saveEdit(); return; }
    else if (a === 'ed-cancel') { UI.detail = UI.edit.date; UI.edit = null; }
    render();
  }

  function editField(el) {
    const d = UI.edit.draft;
    if (el.dataset.ed === 'name') { d.name = el.value.trim() || d.name; return; }
    if (el.dataset.ed === 'type') {
      if (!el.value) return;
      const s = C.buildSession(el.value, UI.edit.date, settings());
      UI.edit.draft = draftFrom(s);
      render(); return;
    }
    const L = locate(el.dataset.p), it = L.item, f = el.dataset.ef;
    if (!it) return;
    if (f === 'label') it.label = el.value.trim() || it.label;
    else if (f === 'replabel') it.label = el.value.trim() || 'Intervals';
    else if (f === 'min') it.sec = clampSec((Math.max(0, Number(el.value) || 0)) * 60 + it.sec % 60);
    else if (f === 'sec') it.sec = clampSec(Math.floor(it.sec / 60) * 60 + Number(el.value));
    else if (f === 'zone') it.zone = el.value ? el.value.split('-').map(Number) : null;
    else if (f === 'move') it.move = el.value.trim() || it.move;
    else if (f === 'sets') { it.sets = Number(el.value); it.sec = it.sets * 120; }
    else if (f === 'reps') it.reps = el.value.trim() || it.reps;
    if (it.kind === 'lift') it.label = C.liftLabel(it);
    if (f === 'zone' && it.zone) it.kind = it.zone[1] >= 3 ? 'work' : (it.kind === 'work' ? 'easy' : it.kind);
    render();
  }

  function saveEdit() {
    const E = UI.edit, d = E.draft;
    if (d.sport && !d.blocks.length) { toast('Add at least one step, or pick Rest under "Start over".', true); return; }
    S.overrides[E.date] = { type: d.type, sport: d.sport, name: d.name, focus: d.focus, blocks: d.blocks, notes: [] };
    saveSettings();
    UI.detail = E.date; UI.edit = null; render();
    if (isDemo()) toast('Saved. Connect Intervals.icu in Settings to send it to your watch.');
    else if (C.daysBetween(today(), E.date) <= 6) sendWeek();
    else toast('Saved. It goes to your watch when it is within 7 days.');
  }

  function resetDay(date) {
    delete S.overrides[date]; saveSettings(); render();
    if (!isDemo() && C.daysBetween(today(), date) <= 6) sendWeek();
    else toast('Back to the planned workout.');
  }

  function viewZones() {
    const max = C.maxHrFor(S);
    const est = !(Number(S.maxHr) > 0);
    const ranges = C.zoneRanges(max);
    const r = ready();
    const runSet = (D.sport || []).find(s => (s.types || []).includes('Run'));
    let h = header('Heart rate zones', '% of max heart rate') + banner();
    h += '<div class="grid2"><label class="card stat"><span class="ml">Max heart rate (bpm)</span><input type="number" inputmode="numeric" min="120" max="230" placeholder="' + C.estMaxHr(S.age) + '" value="' + esc(S.maxHr) + '" data-setting="maxHr"><span class="ms' + (est ? ' warn' : '') + '">' + (est ? 'Estimated from age ' + esc(S.age) : 'Your measured max') + '</span></label>' +
      '<div class="card stat"><span class="ml">Resting heart rate</span><span class="big">' + (r && r.metrics.rhr ? r.metrics.rhr.value : '—') + ' <small>bpm</small></span><span class="ms">' + (r && r.metrics.rhr ? 'From your watch' : 'No data yet') + '</span></div></div>';
    h += '<div class="list">' + ranges.slice().reverse().map(z => '<div class="card zone"><span class="zbadge" style="background:' + C.Z_COLORS[z.zone - 1] + '">' + z.zone + '</span><div class="grow"><div class="step-name">' + C.Z_NAMES[z.zone - 1] + '</div><div class="muted small">' + C.Z_USES[z.zone - 1] + '</div></div><span class="zr">' + (z.zone === 1 ? '< ' + z.hi : z.lo + '–' + z.hi) + '</span></div>').join('') + '</div>';
    if (!isDemo() && D.loaded) {
      const icuTops = runSet && runSet.hr_zones ? runSet.hr_zones.slice(0, 5) : null;
      const match = icuTops && icuTops.join() === C.zoneTops(max).join() && runSet.max_hr === max;
      h += '<section class="card ' + (match ? '' : 'warn-card') + '"><b>' + (match ? 'Intervals.icu matches' : 'Intervals.icu zones differ') + '</b><span class="muted small">' +
        (runSet ? 'Intervals.icu Run: max ' + esc(runSet.max_hr || '—') + ', zone tops ' + esc(icuTops ? icuTops.join(' / ') : 'not set') + '. Workouts use Intervals.icu\'s zones, so keep them in step.' : 'Could not read your Intervals.icu sport settings.') +
        '</span>' + (match ? '' : '<button class="btn" data-action="syncZones"' + (UI.syncingZones ? ' disabled' : '') + '>' + (UI.syncingZones ? 'Copying…' : 'Copy these zones to Intervals.icu') + '</button>') + '</section>';
    }
    h += '<section class="card tip"><b>Make these yours</b><span class="small">Age formulas can be off by 10+ bpm. After a few hard efforts, use the highest heart rate you\'ve seen as your max. Set the same max in Garmin Connect\'s heart rate zones so the watch agrees.</span></section>';
    return h;
  }

  function viewSettings() {
    const opts = Object.keys(C.SESSION_TYPES).map(k => '<option value="' + k + '">' + C.SESSION_TYPES[k].label + '</option>');
    const sel = day => '<select data-schedule="' + day + '" aria-label="' + day + ' session">' + opts.map(o => o.replace('value="' + S.schedule[day] + '"', 'value="' + S.schedule[day] + '" selected')).join('') + '</select>';
    let h = header('Settings', 'Pace') + (D.error && !isDemo() ? '<div class="banner err">' + esc(D.error) + '</div>' : '');
    h += '<section class="card"><span class="eyebrow">INTERVALS.ICU</span>' +
      '<label class="field"><span>API key</span><input type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste from Intervals.icu → Settings → Developer" value="' + esc(S.apiKey) + '" data-setting="apiKey"></label>' +
      '<label class="field"><span>Athlete ID <small class="muted">(0 = you)</small></span><input type="text" autocapitalize="off" value="' + esc(S.athleteId) + '" data-setting="athleteId"></label>' +
      '<button class="btn" data-action="test">Test connection</button>' +
      '<ol class="steps-help small"><li>In Intervals.icu, connect Garmin and turn on <b>Upload planned workouts</b>.</li><li>Under Settings → Developer Settings, create an API key and paste it above.</li><li>The key stays on this phone only.</li></ol></section>';
    h += '<section class="card"><span class="eyebrow">YOU</span><div class="grid2">' +
      '<label class="field"><span>Age</span><input type="number" inputmode="numeric" value="' + esc(S.age) + '" data-setting="age"></label>' +
      '<label class="field"><span>Plan start</span><input type="date" value="' + esc(S.planStart || C.mondayOf(today())) + '" data-setting="planStart"></label></div></section>';
    h += '<section class="card"><span class="eyebrow">WEEKLY SCHEDULE</span>' + C.DAY_KEYS.map((d, i) => '<label class="sched"><span>' + C.DAY_SHORT[i] + '</span>' + sel(d) + '</label>').join('') +
      '<div class="tiny">Keep hard days apart: Run workout, Long run and Long ride work best with an easy day or rest between them.</div></section>';
    h += '<section class="card"><span class="eyebrow">BEHAVIOR</span>' +
      '<label class="toggle"><span><b>Update the watch when I open Pace</b><span class="muted small">Once a day, re-sends the next 7 days so today\'s readiness changes reach the fenix.</span></span><input type="checkbox" data-setting="autoSend"' + (S.autoSend ? ' checked' : '') + '></label>' +
      '<label class="toggle"><span><b>Easy-day ceiling</b><span class="muted small">Easy steps target Zone 1–2 instead of Zone 2 only.</span></span><input type="checkbox" data-setting="easyCeiling"' + (S.easyCeiling !== false ? ' checked' : '') + '></label></section>';
    return h;
  }

  /* ---------------- render ---------------- */
  function render() {
    const v = UI.edit ? viewEdit() : UI.detail ? viewDetail() : ({ today: viewToday, plan: viewPlan, zones: viewZones, settings: viewSettings }[UI.view])();
    document.getElementById('view').innerHTML = v;
    document.querySelectorAll('nav [data-view]').forEach(b => b.setAttribute('aria-current', !UI.detail && !UI.edit && b.dataset.view === UI.view ? 'page' : 'false'));
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const a = el.dataset.action;
    if (a.indexOf('ed-') === 0) { if (UI.edit) editAction(a, el); return; }
    if (a === 'edit') { startEdit(UI.detail); render(); window.scrollTo(0, 0); return; }
    if (a === 'reset') { resetDay(UI.detail); return; }
    if (a === 'go') {
      if (UI.edit && !confirm('Leave without saving your changes?')) return;
      UI.view = el.dataset.view; UI.detail = null; UI.edit = null; render(); window.scrollTo(0, 0);
    }
    else if (a === 'open') { UI.detail = el.dataset.date; render(); window.scrollTo(0, 0); }
    else if (a === 'back') { UI.detail = null; render(); }
    else if (a === 'week') { UI.weekOffset = Number(el.dataset.off); render(); }
    else if (a === 'send') sendWeek();
    else if (a === 'refresh') loadAll({ skipAuto: true });
    else if (a === 'syncZones') syncZones();
    else if (a === 'test') testConnection();
  });

  document.addEventListener('change', e => {
    const el = e.target;
    if (UI.edit && (el.dataset.ed || el.dataset.ef)) { editField(el); return; }
    if (el.dataset.setting) {
      const k = el.dataset.setting;
      const was = S[k];
      S[k] = el.type === 'checkbox' ? el.checked : el.value.trim();
      if (k === 'age') S.age = Number(S.age) || 36;
      if (k === 'apiKey' && S.apiKey && !S.planStart) S.planStart = C.mondayOf(today());
      saveSettings();
      if ((k === 'apiKey' || k === 'athleteId') && was !== S[k]) { D.athlete = null; loadAll({ skipAuto: true }); return; }
      render();
    } else if (el.dataset.schedule) {
      S.schedule[el.dataset.schedule] = el.value; saveSettings(); render();
    }
  });

  document.addEventListener('input', e => {
    if (!e.target.dataset.pickQ || !UI.edit || !UI.edit.picker) return;
    UI.edit.picker.q = e.target.value;
    const el = document.getElementById('pick-results');
    if (el) el.innerHTML = pickResults();
  });

  window.addEventListener('pageshow', () => loadAll());
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && D.loaded && !isDemo() && (S.lastSent || '').slice(0, 10) !== today()) loadAll();
  });
})();

</script>
</body>
</html>
